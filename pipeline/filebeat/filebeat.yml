filebeat.inputs:
  # ── COWRIE (SSH/Telnet) ──────────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/cowrie/log/cowrie/cowrie.json
    tags: ["cowrie", "honeypot"]
    json.keys_under_root: true
    json.add_error_key: true
  # ── DIONAEA (Malware) ────────────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/dionaea/dionaea/dionaea.log
    tags: ["dionaea", "honeypot"]
  # ── ZEEK (Network IDS) ──────────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/zeek/*/conn.log
      - /var/log/zeek/*/ssh.log
    tags: ["zeek", "honeypot"]
    json.keys_under_root: true
    json.add_error_key: true
  # ── GALAH (HTTP LLM Honeypot) ────────────────────────
  - type: log
    enabled: true
    paths:
      - /var/log/galah/app/event_log.json
    tags: ["galah", "honeypot"]
    json.keys_under_root: true
    json.add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
