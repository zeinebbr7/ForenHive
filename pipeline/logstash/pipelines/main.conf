input {
  beats {
    port => 5044
  }
}

filter {

  # ── COWRIE ──────────────────────────────────────────
  if "cowrie" in [tags] {
    mutate { add_field => { "honeypot.type" => "cowrie" } }

    geoip {
      source => "src_ip"
      target => "source.geo"
    }

    mutate {
      rename => {
        "src_ip"   => "source.ip"
        "username" => "user.name"
        "password" => "user.password"
        "eventid"  => "event.id"
      }
      add_field => { "event.category" => "authentication" }
    }

    if [event.id] == "cowrie.login.failed" {
      mutate { add_field => { "event.outcome" => "failure" } }
    } else if [event.id] == "cowrie.login.success" {
      mutate { add_field => { "event.outcome" => "success" } }
    }
  }

  # ── DIONAEA ─────────────────────────────────────────
  else if "dionaea" in [tags] {
    mutate {
      add_field => {
        "honeypot.type"  => "dionaea"
        "event.category" => "network"
      }
    }
  }

  # ── GALAH ───────────────────────────────────────────
  else if "galah" in [tags] {
    mutate {
      add_field => {
        "honeypot.type"  => "galah"
        "event.category" => "web"
      }
    }

    geoip {
      source => "source_ip"
      target => "source.geo"
    }

    mutate {
      rename => {
        "source_ip"   => "source.ip"
        "method"      => "http.request.method"
        "uri"         => "http.request.uri"
      }
    }
  }

  # ── ZEEK ────────────────────────────────────────────
  else if "zeek" in [tags] {
    mutate {
      add_field => {
        "honeypot.type"  => "zeek"
        "event.category" => "network"
      }
    }

    geoip {
      source => "id.orig_h"
      target => "source.geo"
    }

    mutate {
      rename => {
        "id.orig_h" => "source.ip"
        "id.orig_p" => "source.port"
        "id.resp_h" => "destination.ip"
        "id.resp_p" => "destination.port"
        "proto"     => "network.transport"
      }
    }

    date {
      match => ["ts", "UNIX"]
      target => "@timestamp"
      remove_field => ["ts"]
    }
  }

  # ── NETTOYAGE COMMUN ────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["forenhive-elasticsearch:9200"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
  }
}
