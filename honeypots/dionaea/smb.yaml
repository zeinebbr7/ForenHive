- name: smb
  config:
    os_type: 4
    primary_domain: WORKGROUP
    oem_domain_name: WORKGROUP
    server_name: WIN-SERVER2019
    native_os: Windows Server 2019 Datacenter 17763
    native_lan_manager: Windows Server 2019 Datacenter 6.3
    shares:
      ADMIN$:
        comment: Remote Admin
        path: C:\\Windows
        type: disktree
      C$:
        comment: Default Share
        path: C:\\
        type:
          - disktree
          - special
      IPC$:
        comment: Remote IPC
        type: ipc
