[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "archive",
    "honeypots/galah/galah-src",
    "**/__pycache__",
    "frontend/dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
