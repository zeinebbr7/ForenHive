<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Carte Géo</div>
    <h2 class="page-title">Carte des <span>attaquants</span></h2>
    <div class="page-sub">Positions géographiques réelles · enrichissement GeoIP MaxMind.</div>
  </div>
  <div class="page-actions">
    <span id="geo-badge" class="badge blue" style="font-size:12px">Chargement…</span>
  </div>
</div>

<div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px">
  <div id="map" style="height:520px;background:#0a0e1a"></div>
  <div id="map-legend" style="
    position:absolute;bottom:24px;right:12px;z-index:1000;
    background:rgba(10,14,26,.9);border:1px solid var(--border);
    border-radius:8px;padding:10px 14px;font-size:11px;
    font-family:'JetBrains Mono',monospace;color:var(--text2);
    pointer-events:none">
    <div style="margin-bottom:6px;font-size:10px;color:var(--text3);letter-spacing:.06em">LÉGENDE</div>
    <div class="flex items-c gap-8" style="margin-bottom:4px">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(255,80,80,.8)" stroke="#ff5050" stroke-width="1.5"/></svg>
      Dionaea
    </div>
    <div class="flex items-c gap-8" style="margin-bottom:4px">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(250,185,5,.8)" stroke="#fab905" stroke-width="1.5"/></svg>
      Cowrie
    </div>
    <div class="flex items-c gap-8" style="margin-bottom:4px">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(180,100,255,.8)" stroke="#b464ff" stroke-width="1.5"/></svg>
      Galah
    </div>
    <div class="flex items-c gap-8">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(80,160,255,.8)" stroke="#50a0ff" stroke-width="1.5"/></svg>
      Zeek NDR
    </div>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-h"><div class="card-t">Top pays</div></div>
    <div id="geo-countries"><div class="alert info">Chargement…</div></div>
  </div>
  <div class="card">
    <div class="card-h"><div class="card-t">Top IPs géolocalisées</div><div class="card-sub" id="geo-sub">cliquer pour centrer la carte</div></div>
    <div id="geo-ips"><div class="alert info">Chargement…</div></div>
  </div>
</div>

<script>
(async function(){
  const { SOURCE_META, fmt, esc, $, $$, flag, evNormalize } = FH;

  /* ── Init Leaflet map (L is loaded globally in app.html) ── */
  const map = L.map('map', {
    center: [20, 10],
    zoom: 2,
    zoomControl: true,
    attributionControl: false,
    worldCopyJump: false,
    maxBounds: [[-90, -200], [90, 200]],
    maxBoundsViscosity: 0.8,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    subdomains: 'abcd',
  }).addTo(map);

  /* Force Leaflet to recalculate tile coverage after the div is fully rendered */
  setTimeout(() => map.invalidateSize(), 100);

  /* ── Fetch geo events by querying each honeypot type directly.
       This bypasses the Zeek flood: cowrie/dionaea/galah events are always
       on page 1 of their own filtered results regardless of Zeek volume. ── */
  async function fetchGeoEvents() {
    const results = await Promise.allSettled([
      api.attacks({ page_size: 100, page: 1, honeypot: 'cowrie'  }),
      api.attacks({ page_size: 100, page: 1, honeypot: 'dionaea' }),
      api.attacks({ page_size: 100, page: 1, honeypot: 'galah'   }),
    ]);
    const seen = new Set();
    const all = [];
    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      for (const item of (r.value.items || [])) {
        if (!seen.has(item.id)) { seen.add(item.id); all.push(item); }
      }
    }
    return all.map(evNormalize);
  }

  /* ── Extract real coordinates from raw['source.geo']
       Handles both flat Logstash format: {ip, country_iso_code, location}
       and nested injected format: {geo: {country_iso_code, location}, ip} ── */
  function extractGeo(n) {
    const raw = n.raw || {};
    const sg = raw['source.geo'];
    if (!sg || typeof sg !== 'object') return null;
    /* Try flat format first (real Logstash output), then nested */
    const geo = (sg.location ? sg : sg.geo) || sg;
    if (!geo || typeof geo !== 'object') return null;
    const loc = geo.location;
    if (!loc) return null;
    const lat = parseFloat(loc.lat);
    const lon = parseFloat(loc.lon);
    if (isNaN(lat) || isNaN(lon)) return null;
    return {
      lat,
      lon,
      country_code: geo.country_iso_code || '',
      country_name: geo.country_name || '',
      city:         geo.city_name || geo.region_name || '',
    };
  }

  function markerColor(hp) {
    const map = {
      dionaea: { fill: 'rgba(255,80,80,.8)',   stroke: '#ff5050' },
      cowrie:  { fill: 'rgba(250,185,5,.8)',   stroke: '#fab905' },
      galah:   { fill: 'rgba(180,100,255,.8)', stroke: '#b464ff' },
      zeek:    { fill: 'rgba(80,160,255,.8)',  stroke: '#50a0ff' },
    };
    return map[hp] || { fill: 'rgba(120,200,120,.8)', stroke: '#78c878' };
  }

  try {
    const normalized = await fetchGeoEvents();

    /* Aggregate by IP */
    const byIP = {};
    normalized.forEach(n => {
      const geo = extractGeo(n);
      if (!geo) return;
      const ip = n.source_ip || (n.raw && n.raw['source.ip']) || '?';
      if (!byIP[ip]) {
        byIP[ip] = { ip, geo, honeypot: n.honeypot, count: 0 };
      }
      byIP[ip].count++;
    });

    const ipList = Object.values(byIP).sort((a,b) => b.count - a.count);
    $('#geo-badge').textContent = `${ipList.length} IP${ipList.length>1?'s':''} géolocalisée${ipList.length>1?'s':''}`;

    if (!ipList.length) {
      $('#geo-countries').innerHTML = `<div class="alert info">
        Aucune IP géolocalisée sur les 7 derniers jours.<br>
        Le trafic local 172.16.x.x ne passe pas par GeoIP.
      </div>`;
      $('#geo-ips').innerHTML = `<div class="alert info">Aucune donnée.</div>`;
      return;
    }

    /* ── Draw markers ── */
    const bounds = [];
    const markerMap = {};

    ipList.forEach(d => {
      const clr = markerColor(d.honeypot);
      const r   = Math.max(8, Math.min(26, 8 + Math.log2(d.count + 1) * 3));
      bounds.push([d.geo.lat, d.geo.lon]);

      const circle = L.circleMarker([d.geo.lat, d.geo.lon], {
        radius:      r,
        fillColor:   clr.fill,
        color:       clr.stroke,
        weight:      1.5,
        fillOpacity: 0.85,
      });

      const meta = SOURCE_META[d.honeypot] || { label: d.honeypot || '?', icon: '' };
      circle.bindPopup(
        `<div style="font-family:'JetBrains Mono',monospace;font-size:12px;min-width:180px">
          <div style="font-size:14px;font-weight:700;margin-bottom:6px">${flag(d.geo.country_code)} ${esc(d.ip)}</div>
          <div style="color:#aaa;margin-bottom:4px">${esc(d.geo.country_name)}${d.geo.city?' · '+esc(d.geo.city):''}</div>
          <div style="margin-bottom:4px">${meta.icon} ${esc(meta.label)}</div>
          <div style="color:#fab905"><b>${d.count}</b> événement${d.count>1?'s':''}</div>
        </div>`,
        { maxWidth: 240 }
      );

      circle.addTo(map);
      markerMap[d.ip] = circle;
    });

    if (bounds.length) {
      map.fitBounds(bounds, { padding: [60, 60], maxZoom: 7, minZoom: 2 });
      /* Prevent world-wrap repeating at low zoom */
      if (map.getZoom() < 2) map.setZoom(2);
    }

    /* ── Country table ── */
    const byCountry = {};
    ipList.forEach(d => {
      const k = d.geo.country_code || '??';
      if (!byCountry[k]) byCountry[k] = { code: k, name: d.geo.country_name || k, count: 0, ips: 0 };
      byCountry[k].count += d.count;
      byCountry[k].ips++;
    });
    const countries = Object.values(byCountry).sort((a,b) => b.count - a.count);
    const maxC = countries[0] ? countries[0].count : 1;

    $('#geo-countries').innerHTML = `
      <table class="tbl"><thead><tr><th>Pays</th><th>IPs</th><th>Événements</th><th style="width:80px"></th></tr></thead>
      <tbody>${countries.map(c => `<tr>
        <td>${flag(c.code)} ${esc(c.name)}</td>
        <td class="mono">${c.ips}</td>
        <td class="mono">${c.count}</td>
        <td><div style="background:rgba(250,185,5,.15);border-radius:3px;height:5px;overflow:hidden">
          <div style="background:var(--gold);height:100%;width:${Math.round(c.count/maxC*100)}%"></div>
        </div></td>
      </tr>`).join('')}</tbody></table>`;

    /* ── IP table ── */
    $('#geo-ips').innerHTML = `
      <table class="tbl"><thead><tr><th>IP</th><th>Localisation</th><th>Évén.</th></tr></thead>
      <tbody>${ipList.slice(0,15).map(d => `
        <tr class="geo-ip-row" data-ip="${esc(d.ip)}" style="cursor:pointer">
          <td class="mono" style="font-size:11px">${esc(d.ip)}</td>
          <td style="font-size:11px">${flag(d.geo.country_code)} ${esc(d.geo.country_name)}${d.geo.city?' · '+esc(d.geo.city):''}</td>
          <td><span class="badge ${d.honeypot==='zeek'?'blue':d.honeypot==='dionaea'?'red':'gold'}">${d.count}</span></td>
        </tr>`).join('')}</tbody></table>`;

    /* Click row → flyTo + open popup */
    $$('.geo-ip-row').forEach(row => {
      row.addEventListener('click', () => {
        const marker = markerMap[row.dataset.ip];
        if (!marker) return;
        const ll = marker.getLatLng();
        map.flyTo([ll.lat, ll.lng], 6, { duration: 1 });
        setTimeout(() => marker.openPopup(), 1100);
      });
    });

  } catch (e) {
    console.error('GeoMap error:', e);
    $('#geo-badge').textContent = 'Erreur';
    $('#geo-countries').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    $('#geo-ips').innerHTML       = `<div class="alert err">${esc(e.message)}</div>`;
  }
})();
</script>
