<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">🧠 Profiling</div>
    <h2 class="page-title">Profils <span>des attaquants</span></h2>
    <div class="page-sub">IPs observées, enrichies avec AbuseIPDB, VirusTotal et Shodan.</div>
  </div>
</div>

<div class="filters">
  <input class="form-i" id="p-search" placeholder="🔍 IP, ASN, pays…" style="min-width:240px">
  <select class="form-s" id="p-sort"><option value="score">Tri : score</option><option value="sessions">Tri : sessions</option><option value="last">Tri : dernière activité</option></select>
</div>

<div class="grid-3" id="prof-grid"></div>

<script>
(function(){
  const { PROFILES, COUNTRIES, MITRE_TECHNIQUES, fmt, esc, $, $$ } = FH;
  const countryName = iso => (COUNTRIES.find(c => c.iso === iso) || {name:iso, flag:'🏳️'});
  let list = [...PROFILES];

  function render(){
    $('#prof-grid').innerHTML = list.map(p => {
      const c = countryName(p.country);
      const cls = p.score<40?'lo':(p.score<70?'md':'hi');
      const badges = [];
      if (p.tor) badges.push('<span class="badge red">🧅 TOR</span>');
      if (p.vpn) badges.push('<span class="badge gold">🛡 VPN</span>');
      if (p.score >= 80) badges.push('<span class="badge red">BOTNET</span>');
      return `<div class="prof-card" data-ip="${esc(p.ip)}">
        <div class="prof-card-h">
          <div class="prof-av">${p.avatar}</div>
          <div class="prof-meta">
            <div class="prof-ip">${esc(p.ip)}</div>
            <div class="prof-asn">${c.flag} ${esc(c.name)}</div>
          </div>
          <span class="score ${cls}">${p.score}</span>
        </div>
        <div class="flex gap-8 mb-12" style="flex-wrap:wrap">${badges.join('')}</div>
        <div class="text-3 mono" style="font-size:10px;margin-bottom:6px">ASN</div>
        <div class="mono text-m" style="font-size:11px;margin-bottom:10px">${esc(p.asn)}</div>
        <div class="flex gap-8" style="flex-wrap:wrap">
          ${p.techniques.slice(0,4).map(t => `<span class="tag">${esc(t)}</span>`).join('')}
          ${p.techniques.length>4?`<span class="text-3 mono" style="font-size:10px;align-self:center"> +${p.techniques.length-4}</span>`:''}
        </div>
        <div class="flex items-c" style="justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
          <span class="text-3 mono" style="font-size:11px">${p.sessions} sessions</span>
          <span class="text-3 mono" style="font-size:11px">${fmt.ago(p.lastSeen)} ago</span>
        </div>
      </div>`;
    }).join('') || `<div class="alert info" style="grid-column:1/-1">Aucun profil.</div>`;
  }

  function applyFilter(){
    const q = $('#p-search').value.toLowerCase();
    list = PROFILES.filter(p => !q || p.ip.toLowerCase().includes(q) || p.asn.toLowerCase().includes(q) || (countryName(p.country).name||'').toLowerCase().includes(q));
    const sort = $('#p-sort').value;
    if (sort === 'sessions') list.sort((a,b)=>b.sessions-a.sessions);
    else if (sort === 'last') list.sort((a,b)=>b.lastSeen-a.lastSeen);
    else list.sort((a,b)=>b.score-a.score);
    render();
  }
  $('#p-search').addEventListener('input', applyFilter);
  $('#p-sort').addEventListener('change', applyFilter);

  // Click → detail drawer
  $('#prof-grid').addEventListener('click', e => {
    const card = e.target.closest('.prof-card'); if (!card) return;
    const p = PROFILES.find(x => x.ip === card.dataset.ip); if (!p) return;
    const c = countryName(p.country);
    const cls = p.score<40?'lo':(p.score<70?'md':'hi');
    // mini timeline simulée
    const events = Array.from({length: 6}, (_,i) => ({
      t: p.lastSeen - i*3600*1000*Math.random()*8,
      msg: ['SSH login attempt','HTTP scan /admin','Port scan :22,:80,:443','Payload upload','Command exec','Session end'][i],
    }));
    const techsByTactic = {};
    p.techniques.forEach(tid => {
      const t = MITRE_TECHNIQUES.find(x=>x.id===tid); if (!t) return;
      (techsByTactic[t.tactic] ||= []).push(tid);
    });
    openDrawer(`
      <div class="drawer-h">
        <div class="flex items-c gap-12"><div class="prof-av" style="width:44px;height:44px;font-size:20px">${p.avatar}</div>
          <div><div class="card-t">${esc(p.ip)}</div><div class="card-sub">${c.flag} ${esc(c.name)} · ${esc(p.asn)}</div></div>
        </div>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-b">
        <div class="flex gap-8 mb-20" style="flex-wrap:wrap">
          <span class="score ${cls}" style="font-size:17px;padding:6px 14px">Score ${p.score}</span>
          ${p.tor?'<span class="badge red">🧅 TOR NODE</span>':''}
          ${p.vpn?'<span class="badge gold">🛡 VPN</span>':''}
          ${p.score>=80?'<span class="badge red">BOTNET</span>':''}
        </div>

        <div class="card-sub mb-12">Enrichissement</div>
        <div class="grid-3 mb-20">
          <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">ABUSEIPDB</div><div class="kpi-val" style="font-size:22px;color:var(--red2)">${p.abuse}</div></div>
          <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">VIRUSTOTAL</div><div class="kpi-val" style="font-size:22px;color:var(--gold)">${p.score>=60?Math.floor(p.score/5):0}/92</div></div>
          <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">SHODAN TAGS</div><div class="mono text-m" style="font-size:11px;line-height:1.5">${(p.shodan||[]).slice(0,3).join(', ')}</div></div>
        </div>

        <div class="card-sub mb-12">Techniques MITRE ATT&CK</div>
        <div class="flex gap-8 mb-20" style="flex-wrap:wrap">${p.techniques.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>

        <div class="card-sub mb-12">Timeline des sessions</div>
        <div class="tl" style="padding-left:22px">
          ${events.map(ev => `<div class="tl-ev md">
            <div class="tl-ev-h"><div class="tl-ev-m">${esc(ev.msg)}</div><div class="tl-ev-t">${fmt.date(ev.t)}</div></div>
          </div>`).join('')}
        </div>

        <div class="flex gap-8" style="margin-top:16px">
          <button class="btn btn-out btn-sm">🔍 Sessions liées</button>
          <button class="btn btn-gold btn-sm">📋 Générer rapport</button>
        </div>
      </div>`);
  });

  render();
})();
</script>
