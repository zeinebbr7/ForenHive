services:
  dionaea:
    image: dinotools/dionaea:latest
    container_name: forenhive-dionaea
    restart: unless-stopped
    ports:
      - "21:21"         # FTP          → upload malwares
      - "25:25"         # SMTP         → spam/phishing
      - "80:80"         # HTTP         → attaques web
      - "443:443"       # HTTPS        → attaques web
      - "445:445"       # SMB          → WannaCry
      - "1433:1433"     # MSSQL        → BDD Microsoft
      - "3306:3306"     # MySQL        → BDD open source
      - "5060:5060"     # SIP          → VoIP fraud
      - "5900:5900"     # VNC          → accès bureau
      - "27017:27017"   # MongoDB      → ransomware NoSQL
      - "161:161"       # SNMP         → reconnaissance
      - "389:389"       # LDAP         → Active Directory
    volumes:
      - dionaea-logs:/opt/dionaea/var/log
      - dionaea-malware:/opt/dionaea/var/lib/dionaea
    networks:
      - honeypot-net

volumes:
  dionaea-logs:
  dionaea-malware:

networks:
  honeypot-net:
    external: true
