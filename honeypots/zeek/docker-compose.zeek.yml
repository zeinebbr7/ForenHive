services:
  zeek:
    image: zeek/zeek:latest
    container_name: forenhive-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - zeek-logs:/usr/local/zeek/logs
      - ./local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
    command: zeek -i eno8303 local

volumes:
  zeek-logs:
