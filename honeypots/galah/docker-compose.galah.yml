services:
  galah:
    build: ./galah-src
    container_name: forenhive-galah
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8888:8888"
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=mistral
      - LLM_SERVER_URL=http://172.19.0.1:11434
    networks:
      - honeypot-net

networks:
  honeypot-net:
    external: true
