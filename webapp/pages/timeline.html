<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">⏱️ Temps réel</div>
    <h2 class="page-title">Timeline <span>des événements</span></h2>
    <div class="page-sub">Flux live Elasticsearch · polling 5s.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gh btn-sm" id="tl-pause">⏸ Pause</button>
    <span class="badge teal" id="tl-live-badge"><span class="dot up"></span>LIVE</span>
  </div>
</div>

<div class="filters">
  <select class="form-s" id="tl-src"><option value="">Toutes sources</option></select>
  <select class="form-s" id="tl-sev"><option value="">Toutes sévérités</option><option value="critical">Critique</option><option value="high">Élevée</option><option value="medium">Moyenne</option><option value="low">Faible</option></select>
  <span class="badge blue" id="tl-count">0 événements</span>
</div>

<div class="card">
  <div class="tl" id="tl-list" style="padding-left:22px;max-height:calc(100vh - 280px);overflow-y:auto">
    <div class="alert info">Chargement…</div>
  </div>
</div>

<script>
(function(){
  const { SOURCE_META, ALL_SOURCES, fmt, esc, $, evNormalize } = FH;
  let paused = false;
  let events = [];
  let lastSeenTs = null;
  let filterSrc = '', filterSev = '';

  $('#tl-src').innerHTML = '<option value="">Toutes sources</option>' + ALL_SOURCES.map(s => {
    const m = SOURCE_META[s] || { label: s, icon: '❓' };
    return `<option value="${s}">${m.icon} ${m.label}</option>`;
  }).join('');

  const render = () => {
    const filtered = events.filter(e =>
      (!filterSrc || e.honeypot === filterSrc) &&
      (!filterSev || (e.severity || '').toLowerCase() === filterSev)
    );
    $('#tl-count').textContent = `${filtered.length} événement${filtered.length>1?'s':''}`;
    if (!filtered.length) { $('#tl-list').innerHTML = '<div class="alert info">Aucun événement.</div>'; return; }
    $('#tl-list').innerHTML = filtered.slice(0, 200).map(n => {
      const meta = SOURCE_META[n.honeypot] || { label: n.honeypot, icon: '❓', color: 'var(--text3)' };
      const sevCls = fmt.sevToClass(n.severity);
      const msg = n.command || n.http_path || n.protocol || '—';
      return `<div class="tl-ev ${sevCls}">
        <div class="tl-ev-h">
          <div class="tl-ev-m">${meta.icon} <b style="color:${meta.color}">${meta.label}</b> · ${esc(n.source_ip || '—')} ${n.dest_port?'→ :'+n.dest_port:''}</div>
          <div class="tl-ev-t">${fmt.time(n.timestamp)}</div>
        </div>
        <div class="tl-ev-msg mono" style="font-size:11px;color:var(--text2);margin-top:4px">${esc(String(msg).slice(0,140))}</div>
      </div>`;
    }).join('');
  };

  async function poll() {
    if (paused) return;
    try {
      const res = await api.attacks({ limit: 50 });
      const items = (res && res.items) || [];
      events = items.map(evNormalize).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      render();
    } catch (e) {
      console.warn('poll error', e);
    }
  }

  $('#tl-src').addEventListener('change', e => { filterSrc = e.target.value; render(); });
  $('#tl-sev').addEventListener('change', e => { filterSev = e.target.value; render(); });
  $('#tl-pause').addEventListener('click', () => {
    paused = !paused;
    $('#tl-pause').textContent = paused ? '▶ Reprendre' : '⏸ Pause';
    $('#tl-live-badge').className = paused ? 'badge gold' : 'badge teal';
    $('#tl-live-badge').innerHTML = paused ? '<span class="dot warn"></span>PAUSE' : '<span class="dot up"></span>LIVE';
  });

  poll();
  const iv = setInterval(poll, 5000);
  window.__pageCleanup = () => clearInterval(iv);
})();
</script>
