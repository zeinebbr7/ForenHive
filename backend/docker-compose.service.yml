# Merge this block into the existing docker-compose.yml under `services:`.
# Also add the `reports-data` named volume under the top-level `volumes:` key.
#
# Usage:
#   docker compose up -d backend

services:
  backend:
    build: ./backend
    container_name: forenhive-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ES_HOST=http://elasticsearch:9200
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral:7b}
      - REPORTS_DIR=/reports
      - PG_HOST=forenhive-postgresql
      - PG_PORT=${POSTGRES_PORT:-5432}
      - PG_DB=${POSTGRES_DB:-forenhive}
      - PG_USER=${POSTGRES_USER:-forenhive}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - FORENSIC_ENGINE_URL=http://forensic-engine:8001
    ports:
      - "8000:8000"
    volumes:
      - reports-data:/reports
    networks:
      - backend-net
    depends_on:
      - elasticsearch
      - postgresql
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  reports-data:
