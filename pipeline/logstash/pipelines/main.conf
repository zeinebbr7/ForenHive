input {
  beats {
    port => 5044
  }
}

filter {

  # ── COWRIE ──────────────────────────────────────────
  if "cowrie" in [tags] {
    mutate { add_field => { "honeypot.type" => "cowrie" } }

    geoip {
      source => "src_ip"
      target => "source.geo"
    }

    mutate {
      rename => {
        "src_ip"   => "source.ip"
        "dst_ip"   => "destination.ip"
        "dst_port" => "destination.port"
        "username" => "user.name"
        "password" => "user.password"
        "eventid"  => "event.id"
        "protocol" => "network.transport"
        "session"  => "session.id"
      }
    }

    # Extraire la commande depuis message (format "CMD: <commande>")
    if [message] =~ /^CMD:/ {
      grok {
        match => { "message" => "^CMD: %{GREEDYDATA:process.command_line}" }
        tag_on_failure => []
      }
    }

    if [event.id] {
      mutate { copy => { "event.id" => "event.action" } }
      mutate { gsub => [ "event.action", "^cowrie\.", "" ] }
    }

    if [event.id] =~ /^cowrie\.login/ {
      mutate { add_field => { "event.category" => "authentication" } }
      if [event.id] == "cowrie.login.failed" {
        mutate { add_field => { "event.outcome" => "failure" } }
      } else if [event.id] == "cowrie.login.success" {
        mutate { add_field => { "event.outcome" => "success" } }
      }
    } else if [event.id] =~ /^cowrie\.command/ {
      mutate { add_field => { "event.category" => "process" } }
    } else if [event.id] =~ /^cowrie\.session/ {
      mutate { add_field => { "event.category" => "session" } }
    } else {
      mutate { add_field => { "event.category" => "network" } }
    }

    mutate {
      remove_field => ["sensor", "uuid", "ttylog", "shasum", "duplicate", "duration", "size"]
    }
  }

  # ── DIONAEA ─────────────────────────────────────────
  else if "dionaea" in [tags] {
    mutate {
      add_field => {
        "honeypot.type"  => "dionaea"
        "event.category" => "network"
      }
    }

    grok {
      match => {
        "message" => [
          "connection %{DATA} %{WORD:event.action}/%{WORD:network.transport}/%{WORD:dionaea.protocol} \[%{IP:destination.ip}:%{NUMBER:destination.port}->%{IP:source.ip}:%{NUMBER:source.port}\]",
          "\[%{DATA:dionaea.date}\] %{WORD:dionaea.module} %{DATA:dionaea.file}-%{WORD:dionaea.level}:\s+%{GREEDYDATA:dionaea.msg}",
          "connection %{DATA} from %{IP:source.ip}:%{NUMBER:source.port} to %{IP:destination.ip}:%{NUMBER:destination.port}",
          "recv\(%{IP:source.ip}\)"
        ]
      }
      tag_on_failure => ["_dionaea_grok_failed"]
    }

    # Drop Python tracebacks and startup noise
    if "_dionaea_grok_failed" in [tags] {
      drop {}
    }

    if [source.ip] {
      geoip {
        source => "source.ip"
        target => "source.geo"
      }
    }
  }

  # ── GALAH ───────────────────────────────────────────
  else if "galah" in [tags] {
    mutate {
      add_field => {
        "honeypot.type"  => "galah"
        "event.category" => "web"
      }
    }

    geoip {
      source => "srcIP"
      target => "source.geo"
    }

    mutate {
      rename => {
        "srcIP"                              => "source.ip"
        "srcPort"                            => "source.port"
        "[httpRequest][method]"              => "http.request.method"
        "[httpRequest][request]"             => "http.request.uri"
        "[httpRequest][userAgent]"           => "user_agent.original"
        "[httpRequest][bodySha256]"          => "http.request.body.hash"
        "[httpRequest][sessionID]"           => "session.id"
        "[httpRequest][protocolVersion]"     => "http.version"
        "[httpResponse][headers][Server]"    => "http.response.server"
        "[responseMetadata][generationSource]" => "galah.response.source"
        "[responseMetadata][info][model]"    => "galah.llm.model"
        "sensorName"                         => "observer.name"
        "port"                               => "destination.port"
      }
      add_field => { "event.action" => "http_request" }
    }

    mutate {
      remove_field => ["httpRequest", "httpResponse", "responseMetadata", "srcHost", "level", "msg"]
    }
  }

  # ── ZEEK ────────────────────────────────────────────
  else if "zeek" in [tags] {
    mutate {
      add_field => {
        "honeypot.type"  => "zeek"
        "event.category" => "network"
      }
    }

    geoip {
      source => "id.orig_h"
      target => "source.geo"
    }

    mutate {
      rename => {
        "id.orig_h" => "source.ip"
        "id.orig_p" => "source.port"
        "id.resp_h" => "destination.ip"
        "id.resp_p" => "destination.port"
        "proto"     => "network.transport"
      }
    }

    date {
      match => ["ts", "UNIX"]
      target => "@timestamp"
      remove_field => ["ts"]
    }
  }

  # ── NETTOYAGE COMMUN ────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["forenhive-elasticsearch:9200"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
  }
}

