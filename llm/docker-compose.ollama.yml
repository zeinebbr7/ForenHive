services:
  ollama:
    image: ollama/ollama:latest
    container_name: forenhive-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend-net
    ports:
      - "11435:11434"

networks:
  backend-net:
    name: backend-net
    driver: bridge

volumes:
  ollama-models:
