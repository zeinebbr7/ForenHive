<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Access Control</div>
    <h2 class="page-title">Access <span>Control</span></h2>
    <div class="page-sub">RBAC System — JWT tokens · Roles: <span class="mono">ADMIN</span>, <span class="mono">ANALYST</span>, <span class="mono">VIEWER</span>.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gold btn-sm" id="ac-add"> Add User</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi g"><div class="kpi-label">Users</div><div class="kpi-val" id="kpi-total">—</div><div class="kpi-delta">registered accounts</div></div>
  <div class="kpi r"><div class="kpi-label">Admins</div><div class="kpi-val" id="kpi-admin">—</div><div class="kpi-delta">full access</div></div>
  <div class="kpi b"><div class="kpi-label">Analysts</div><div class="kpi-val" id="kpi-analyst">—</div><div class="kpi-delta">read + write</div></div>
  <div class="kpi p"><div class="kpi-label">Viewers</div><div class="kpi-val" id="kpi-viewer">—</div><div class="kpi-delta">read only</div></div>
</div>

<div class="card">
  <div class="card-h">
    <div class="card-t">Users</div>
    <div class="card-sub">Account list · role · activity</div>
  </div>
  <table class="tbl">
    <thead><tr>
      <th>Email</th><th>Role</th><th>Created</th><th>Last Login</th><th>Status</th>
    </tr></thead>
    <tbody id="ac-rows"><tr><td colspan="5">Loading…</td></tr></tbody>
  </table>
</div>

<script>
(async function(){
  const { fmt, esc, $ } = FH;

  function roleBadge(r) {
    const role = (r || '').toLowerCase();
    if (role === 'admin')   return '<span class="badge red"> ADMIN</span>';
    if (role === 'analyst') return '<span class="badge gold"> ANALYST</span>';
    if (role === 'viewer')  return '<span class="badge blue"> VIEWER</span>';
    return '<span class="badge gray">'+esc(role||'—')+'</span>';
  }

  async function load() {
    try {
      const list = await api.users();
      const items = Array.isArray(list) ? list : (list.items || []);
      $('#kpi-total').textContent = items.length;
      const counts = { admin:0, analyst:0, viewer:0 };
      items.forEach(u => { const r=(u.role||'').toLowerCase(); if (counts[r]!=null) counts[r]++; });
      $('#kpi-admin').textContent   = counts.admin;
      $('#kpi-analyst').textContent = counts.analyst;
      $('#kpi-viewer').textContent  = counts.viewer;

      if (!items.length) {
        $('#ac-rows').innerHTML = `<tr><td colspan="5"><div class="alert info">No users — the admin bootstrap account is created on first backend startup.</div></td></tr>`;
        return;
      }
      $('#ac-rows').innerHTML = items.map(u => `<tr>
        <td><b>${esc(u.email)}</b></td>
        <td>${roleBadge(u.role)}</td>
        <td class="mono" style="font-size:11px">${fmt.date(u.created_at)}</td>
        <td class="mono" style="font-size:11px">${(u.last_login_at || u.last_login) ? fmt.date(u.last_login_at || u.last_login) : '—'}</td>
        <td><span class="badge ${u.is_active===false?'gray':'teal'}">${u.is_active===false?'Disabled':'Active'}</span></td>
      </tr>`).join('');
    } catch (e) {
      $('#ac-rows').innerHTML = `<tr><td colspan="5"><div class="alert err">${esc(e.message)} — user management requires the ADMIN role.</div></td></tr>`;
    }
  }

  $('#ac-add').addEventListener('click', () => {
    if (typeof openModal !== 'function') {
      alert('Create user — available via API: POST /api/auth/users');
      return;
    }
    openModal(`
      <div class="modal-h"><div class="card-t">New User</div><button class="drawer-close" onclick="closeModal()"></button></div>
      <div class="alert info">Create user — backend endpoint to expose (POST /api/auth/users). Button present for demo.</div>
      <div class="flex gap-8" style="justify-content:flex-end;margin-top:12px">
        <button class="btn btn-gh btn-sm" onclick="closeModal()">Close</button>
      </div>
    `);
  });

  await load();
})();
</script>
