services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: forenhive-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
    networks:
      - honeypot-net
    environment:
      - COWRIE_TELNET_ENABLED=yes

volumes:
  cowrie-var:
    external: true
    name: bb474ddc3d2a3f3026c85d4c2fe7f1c5723f2e68f8ba60a05e4c9bb4471292ce

networks:
  honeypot-net:
    external: true
