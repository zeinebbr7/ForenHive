<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">🧠 Profiling</div>
    <h2 class="page-title">Profils <span>des attaquants</span></h2>
    <div class="page-sub">Enrichissement par IP (AbuseIPDB · VirusTotal · Shodan via le forensic engine).</div>
  </div>
</div>

<div class="filters">
  <input class="form-i" id="p-lookup" placeholder="🔍 Rechercher une IP (ex: 185.220.101.5)" style="min-width:320px">
  <button class="btn btn-gold btn-sm" id="p-go">Profiler</button>
</div>

<div class="card mb-20">
  <div class="card-h"><div class="card-t">Top IPs observées</div><div class="card-sub">sur 1000 derniers événements — cliquer pour profiler</div></div>
  <div id="top-ip-grid" class="grid-3"><div class="alert info">Chargement…</div></div>
</div>

<div id="profile-result"></div>

<script>
(async function(){
  const { flag, fmt, esc, $, evNormalize } = FH;

  async function loadTop() {
    try {
      const res = await api.attacks({ limit: 1000 });
      const items = (res && res.items) || [];
      const agg = {};
      items.forEach(raw => {
        const n = evNormalize(raw);
        if (!n.source_ip) return;
        agg[n.source_ip] = agg[n.source_ip] || { ip: n.source_ip, count: 0, country: n.country, honeypots: new Set() };
        agg[n.source_ip].count++;
        if (n.honeypot) agg[n.source_ip].honeypots.add(n.honeypot);
        if (!agg[n.source_ip].country && n.country) agg[n.source_ip].country = n.country;
      });
      const top = Object.values(agg).sort((a,b)=>b.count-a.count).slice(0,18);
      if (!top.length) {
        $('#top-ip-grid').innerHTML = '<div class="alert info" style="grid-column:1/-1">Aucune IP source détectée dans l\'échantillon.</div>';
        return;
      }
      $('#top-ip-grid').innerHTML = top.map(x => `
        <div class="prof-card" data-ip="${esc(x.ip)}" style="cursor:pointer">
          <div class="prof-card-h">
            <div class="prof-av">🎯</div>
            <div class="prof-meta">
              <div class="prof-ip">${esc(x.ip)}</div>
              <div class="prof-asn">${x.country ? flag(x.country)+' '+x.country : '—'}</div>
            </div>
            <span class="score md">${x.count}</span>
          </div>
          <div class="flex gap-8" style="flex-wrap:wrap">
            ${[...x.honeypots].map(h => `<span class="tag">${esc(h)}</span>`).join('')}
          </div>
        </div>`).join('');
      $('#top-ip-grid').querySelectorAll('.prof-card').forEach(c => c.addEventListener('click', () => profile(c.dataset.ip)));
    } catch (e) {
      $('#top-ip-grid').innerHTML = `<div class="alert err" style="grid-column:1/-1">${esc(e.message)}</div>`;
    }
  }

  async function profile(ip) {
    $('#profile-result').innerHTML = `<div class="card"><div class="alert info">⟳ Profiling de ${esc(ip)}…</div></div>`;
    try {
      const p = await api.profile(ip);
      const abuse  = p.abuseipdb || p.abuse || {};
      const vt     = p.virustotal || p.vt || {};
      const shodan = p.shodan || {};
      const stats  = p.stats || {};
      const score  = p.risk_score ?? p.score ?? abuse.abuse_confidence_score ?? 0;
      const sc = fmt.scoreClass(score);
      const tor = p.tor || p.is_tor;
      const vpn = p.vpn || p.is_vpn;

      $('#profile-result').innerHTML = `
        <div class="card">
          <div class="card-h">
            <div class="flex items-c gap-12">
              <div class="prof-av" style="width:44px;height:44px;font-size:20px">🎯</div>
              <div><div class="card-t">${esc(ip)}</div><div class="card-sub">${p.country ? flag(p.country)+' '+esc(p.country) : '—'} · ${esc(p.asn || '—')}</div></div>
            </div>
            <span class="score ${sc}" style="font-size:17px;padding:6px 14px">Score ${score}</span>
          </div>
          <div class="flex gap-8 mb-20" style="flex-wrap:wrap">
            ${tor?'<span class="badge red">🧅 TOR</span>':''}
            ${vpn?'<span class="badge gold">🛡 VPN</span>':''}
            ${score>=80?'<span class="badge red">⚠ HIGH RISK</span>':''}
          </div>

          <div class="card-sub mb-12">Enrichissement</div>
          <div class="grid-3 mb-20">
            <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">ABUSEIPDB</div><div class="kpi-val" style="font-size:22px;color:var(--red2)">${abuse.abuse_confidence_score ?? '—'}</div><div class="text-3 mono" style="font-size:10px">${abuse.total_reports ?? 0} reports</div></div>
            <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">VIRUSTOTAL</div><div class="kpi-val" style="font-size:22px;color:var(--gold)">${vt.malicious ?? '—'}/${vt.total ?? '—'}</div><div class="text-3 mono" style="font-size:10px">moteurs détectant</div></div>
            <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">SHODAN</div><div class="mono text-m" style="font-size:11px;line-height:1.5">${(shodan.tags || shodan.ports || []).slice(0,5).join(', ') || '—'}</div></div>
          </div>

          <div class="card-sub mb-12">Statistiques honeypots</div>
          <div class="grid-3 mb-20">
            <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">ÉVÉNEMENTS</div><div class="kpi-val" style="font-size:22px">${stats.events ?? stats.total_events ?? '—'}</div></div>
            <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">SESSIONS</div><div class="kpi-val" style="font-size:22px">${stats.sessions ?? '—'}</div></div>
            <div class="card" style="padding:12px"><div class="text-3 mono" style="font-size:10px">DERNIÈRE ACTIVITÉ</div><div class="mono text-m" style="font-size:11px">${stats.last_seen ? fmt.ago(stats.last_seen)+' ago' : '—'}</div></div>
          </div>

          <details>
            <summary style="cursor:pointer;color:var(--text2);font-size:12px;font-family:'Share Tech Mono',monospace">Réponse brute</summary>
            <pre class="pre" style="max-height:300px;overflow:auto;margin-top:10px">${esc(JSON.stringify(p, null, 2))}</pre>
          </details>
        </div>`;
    } catch (e) {
      $('#profile-result').innerHTML = `<div class="card"><div class="alert err">Erreur pour ${esc(ip)} : ${esc(e.message)}</div></div>`;
    }
  }

  $('#p-go').addEventListener('click', () => {
    const ip = $('#p-lookup').value.trim();
    if (ip) profile(ip);
  });
  $('#p-lookup').addEventListener('keydown', e => { if (e.key === 'Enter') $('#p-go').click(); });

  await loadTop();
})();
</script>
