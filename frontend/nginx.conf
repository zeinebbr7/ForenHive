server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/forenhive-locations.inc;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/forenhive.crt;
    ssl_certificate_key /etc/nginx/certs/forenhive.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/forenhive-locations.inc;
}
