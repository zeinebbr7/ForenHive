services:
  tanner:
    build: ./tanner-src/docker/tanner
    container_name: forenhive-tanner
    restart: unless-stopped
    user: root
    volumes:
      - tanner-data:/tmp/tanner
    networks:
      - honeypot-net

  snare:
    build: ./snare-src
    container_name: forenhive-snare
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - tanner
    environment:
      - TANNER=forenhive-tanner
      - PAGE_URL=example.com
      - PORT=80
    networks:
      - honeypot-net

volumes:
  tanner-data:

networks:
  honeypot-net:
    external: true
