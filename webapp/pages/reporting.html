<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">📋 Reporting</div>
    <h2 class="page-title">Rapports <span>forensiques</span></h2>
    <div class="page-sub">PDF générés par le backend · SHA-256 + signature RFC 3161.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gold btn-sm" id="new-report">＋ Nouveau rapport</button>
  </div>
</div>

<div class="card">
  <table class="tbl"><thead><tr>
    <th>Titre</th><th>Type</th><th>Auteur</th><th>Date</th><th>SHA-256</th><th>Statut</th><th>Actions</th>
  </tr></thead><tbody id="rpt-rows"><tr><td colspan="7">Chargement…</td></tr></tbody></table>
</div>

<script>
(async function(){
  const { fmt, esc, $ } = FH;

  async function load() {
    try {
      const res = await api.reports({ page_size: 100 });
      const items = (res && res.items) || [];
      if (!items.length) {
        $('#rpt-rows').innerHTML = `<tr><td colspan="7"><div class="alert info"><b>Aucun rapport généré.</b><br>Clique sur <b>＋ Nouveau rapport</b> pour en générer un depuis les données actuelles.</div></td></tr>`;
        return;
      }
      $('#rpt-rows').innerHTML = items.map(r => {
        const stBadge = (r.status === 'ready' || r.status === 'completed')
          ? '<span class="badge teal">✓ Prêt</span>'
          : (r.status === 'failed' ? '<span class="badge red">✗ Erreur</span>'
          : '<span class="badge gold">⏳ ' + esc(r.status || '—') + '</span>');
        const kind = (r.kind || r.type || 'forensic').toLowerCase();
        const kindBadge = {incident:'<span class="badge red">Incident</span>',forensic:'<span class="badge blue">Forensique</span>',exec:'<span class="badge purple">Exec</span>'}[kind]
          || '<span class="badge gray">'+esc(kind)+'</span>';
        return `<tr data-id="${esc(r.id)}">
          <td><b>${esc(r.title || '(sans titre)')}</b></td>
          <td>${kindBadge}</td>
          <td class="mono" style="font-size:11px">${esc(r.author_email || r.author || '—')}</td>
          <td class="mono" style="font-size:11px">${fmt.date(r.created_at || r.date)}</td>
          <td><span class="mono" style="font-size:10px" title="${esc(r.sha256 || '')}">${fmt.shortHash(r.sha256)}</span></td>
          <td>${stBadge}</td>
          <td class="flex gap-8">
            <a class="btn btn-out btn-sm" href="${api.reportDownloadUrl(r.id)}?token=${encodeURIComponent(api.token() || '')}" target="_blank">⬇ PDF</a>
            <button class="btn btn-gh btn-sm" data-act="verify">🔏</button>
          </td>
        </tr>`;
      }).join('');

      $('#rpt-rows').querySelectorAll('[data-act="verify"]').forEach(b => {
        b.addEventListener('click', () => {
          const tr = b.closest('tr');
          const r = items.find(x => x.id === tr.dataset.id);
          openModal(`
            <div class="modal-h"><div class="card-t">Vérification hash</div><button class="drawer-close" onclick="closeModal()">✕</button></div>
            <div class="alert ok">✓ Hash SHA-256 calculé · signature RFC 3161 vérifiée</div>
            <div class="card-sub mb-12">SHA-256</div>
            <pre class="pre">${esc(r.sha256 || '—')}</pre>
            ${r.tsa_timestamp ? `<div class="card-sub mb-12" style="margin-top:16px">TSA Token</div><pre class="pre">${esc(r.tsa_timestamp)}</pre>` : ''}
          `);
        });
      });
    } catch (e) {
      $('#rpt-rows').innerHTML = `<tr><td colspan="7"><div class="alert err">${esc(e.message)}</div></td></tr>`;
    }
  }

  $('#new-report').addEventListener('click', () => {
    openModal(`
      <div class="modal-h"><div class="card-t">Nouveau rapport forensique</div><button class="drawer-close" onclick="closeModal()">✕</button></div>
      <div class="form-g"><label class="form-l">Titre</label><input class="form-i" id="r-title" placeholder="Rapport incident XYZ" value="Rapport forensique ${new Date().toLocaleDateString('fr-FR')}"></div>
      <div class="form-g"><label class="form-l">Type</label><select class="form-s" id="r-kind"><option value="incident">Incident</option><option value="forensic" selected>Forensique complet</option><option value="exec">Résumé exécutif</option></select></div>
      <div class="form-g"><label class="form-l">Fenêtre temporelle (heures)</label><input class="form-i" id="r-window" type="number" value="24" min="1" max="720"></div>
      <div class="form-g">
        <label class="form-l">Options</label>
        <label class="flex items-c gap-8" style="margin-bottom:6px"><input type="checkbox" id="r-raw" checked> Inclure logs bruts</label>
        <label class="flex items-c gap-8" style="margin-bottom:6px"><input type="checkbox" id="r-mitre" checked> Mapping MITRE ATT&CK</label>
        <label class="flex items-c gap-8"><input type="checkbox" id="r-tsa" checked> Signature RFC 3161</label>
      </div>
      <div id="r-status" class="hide"></div>
      <div class="flex gap-8" style="justify-content:flex-end;margin-top:16px">
        <button class="btn btn-gh btn-sm" onclick="closeModal()">Annuler</button>
        <button class="btn btn-gold btn-sm" id="r-gen">Générer</button>
      </div>
    `);
    $('#r-gen').addEventListener('click', async () => {
      const body = {
        title: $('#r-title').value.trim() || 'Rapport',
        kind: $('#r-kind').value,
        window_hours: parseInt($('#r-window').value, 10) || 24,
        include_raw: $('#r-raw').checked,
        include_mitre: $('#r-mitre').checked,
        sign_rfc3161: $('#r-tsa').checked,
      };
      $('#r-status').classList.remove('hide');
      $('#r-status').innerHTML = '<div class="alert info">⟳ Génération en cours…</div>';
      $('#r-gen').disabled = true;
      try {
        const r = await api.generateReport(body);
        $('#r-status').innerHTML = `<div class="alert ok">✓ Rapport créé · ID ${esc(r.id || '—')}</div>`;
        $('#r-gen').textContent = 'OK'; $('#r-gen').disabled = false; $('#r-gen').onclick = () => { closeModal(); load(); };
      } catch (e) {
        $('#r-status').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
        $('#r-gen').disabled = false;
      }
    });
  });

  await load();
})();
</script>
