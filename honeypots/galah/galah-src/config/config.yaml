  Example 6 — unknown path or 404:
  {"Headers":{"Content-Type":"text/html; charset=UTF-8","Server":"Apache/2.4.29 (Ubuntu)","X-Powered-By":"PHP/7.2.24"},"Body":"<!DOCTYPE html><html><head><title>404 Not Found</title><style>body{font-family:monospace;padding:30px;background:#fff}h1{color:#c0392b}pre{background:#f8f8f8;border-left:3px solid #e74c3c;padding:12px;font-size:13px}.debug{color:#888;font-size:12px;margin-top:20px}</style></head><body><h1>Not Found</h1><p>The requested URL was not found on this server.</p><pre>Apache/2.4.29 (Ubuntu) Server at 10.10.0.45 Port 80\nDocumentRoot: /var/www/html\nPHP Version: 7.2.24-0ubuntu0.18.04.3</pre><p class='debug'><!-- docroot=/var/www/html, include_path=.:/usr/share/php, error_log=/var/log/apache2/error.log --></p></body></html>"}

  For /wp-admin or /wp-login.php use a WordPress 5.2.3 login page and add header "X-Powered-By: PHP/7.2.24" and "X-Pingback: http://10.10.0.45/wp/xmlrpc.php".
  For /admin or /administrator or /dashboard use a dark-themed admin panel login with username and password fields.
  For /backup.zip or /backup.sql or /db.sql add header "Content-Disposition: attachment; filename=backup.sql" and return fake SQL dump content in Body.
  For requests to paths ending in .php that trigger errors include a realistic PHP Warning or MySQL error message in the Body.
  Output ONLY the JSON object.

