<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Honeypot Management</div>
    <h2 class="page-title">Active <span>Honeypots</span></h2>
    <div class="page-sub">Container status · captured volume · last event.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gh btn-sm" id="hp-refresh">Refresh</button>
  </div>
</div>

<div class="grid-2" id="hp-grid">
  <div class="alert info">Loading…</div>
</div>

<style>
.hp-card { border:1px solid var(--border); border-radius:10px; background: var(--bg2); padding: 18px; }
.hp-card-h { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.hp-name { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; letter-spacing:.5px; }
.hp-cowrie  .hp-name { color: var(--gold); }
.hp-dionaea .hp-name { color: var(--red2); }
.hp-galah   .hp-name { color: var(--purple2, #9F6AE0); }
.hp-zeek    .hp-name { color: var(--blue2); }
.hp-sub { font-family:'Share Tech Mono',monospace; font-size:11px; color: var(--text3); margin-top:2px; }
.hp-stat { display:flex; gap:18px; margin-top:8px; }
.hp-stat-k { font-family:'Share Tech Mono',monospace; font-size:10px; color: var(--text3); letter-spacing:1px; text-transform:uppercase; }
.hp-stat-v { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color: var(--text); }
.hp-status { font-family:'Share Tech Mono',monospace; font-size:10px; padding: 3px 8px; border-radius: 3px; letter-spacing:1px; }
.hp-status.up   { background: rgba(140,26,43,.12); color: var(--gold); border:1px solid var(--border2); }
.hp-status.down { background: rgba(198,40,40,.12); color: var(--red2); border:1px solid rgba(198,40,40,.30); }
.hp-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:12px; }
.hp-row:last-child { border-bottom:none; }
.hp-row b { color: var(--text2); }
.hp-row .mono { color: var(--gold); }
</style>

<script>
(async function(){
  const { fmt, esc, $ } = FH;

  const HONEYPOTS = [
    { id:'cowrie',  name:'Cowrie',  ports:'SSH:2222 · Telnet:2323',                    desc:'SSH/Telnet Honeypot — captures brute force and shell commands',     container:'forenhive-cowrie'  },
    { id:'dionaea', name:'Dionaea', ports:'SMB:445 · MySQL:3306 · MongoDB:27017 · …',  desc:'Multi-protocol Honeypot — captures malware binaries (Mirai, etc.)', container:'forenhive-dionaea' },
    { id:'galah',   name:'Galah',   ports:'HTTP:8080 · HTTPS:8888',                    desc:'LLM-driven HTTP Honeypot (Ollama Mistral 7B) — dynamic responses',  container:'forenhive-galah'   },
  ];

  async function load() {
    $('#hp-grid').innerHTML = `<div class="alert info">Loading…</div>`;
    let attacks = { items: [] }, health = {};
    try { attacks = await api.attacks({ page_size: 500 }); } catch(e){}
    try { health  = await api.health(); } catch(e){}

    const items = (attacks && attacks.items) || [];
    const stats = {};
    HONEYPOTS.forEach(h => stats[h.id] = { count: 0, last: 0 });
    items.forEach(ev => {
      const hp = ev.honeypot || (ev.raw && ev.raw['honeypot.type']);
      if (!hp || !stats[hp]) return;
      stats[hp].count++;
      const t = +new Date(ev.timestamp || (ev.raw && ev.raw['@timestamp']) || 0);
      if (t > stats[hp].last) stats[hp].last = t;
    });

    const services = (health && health.services) || {};
    $('#hp-grid').innerHTML = HONEYPOTS.map(h => {
      const s = stats[h.id];
      const upDown = services[h.id] || services[h.container] || (s.count > 0 ? 'up' : 'unknown');
      const isUp = String(upDown).toLowerCase() === 'up' || s.count > 0;
      return `<div class="hp-card hp-${h.id}">
        <div class="hp-card-h">
          <div>
            <div class="hp-name">${esc(h.name)}</div>
            <div class="hp-sub">${esc(h.container)}</div>
          </div>
          <span class="hp-status ${isUp?'up':'down'}">${isUp?'● RUNNING':'○ STOPPED'}</span>
        </div>
        <div class="hp-stat">
          <div>
            <div class="hp-stat-k">Events</div>
            <div class="hp-stat-v">${fmt.num(s.count)}</div>
          </div>
          <div>
            <div class="hp-stat-k">Last</div>
            <div class="hp-stat-v" style="font-size:14px">${s.last ? fmt.ago(s.last) : '—'}</div>
          </div>
        </div>
        <div style="margin-top:14px">
          <div class="hp-row"><b>Ports</b><span class="mono">${esc(h.ports)}</span></div>
          <div class="hp-row"><b>Description</b><span style="text-align:right;color:var(--text3);font-size:11px;max-width:60%">${esc(h.desc)}</span></div>
        </div>
        <div style="margin-top:14px">
          <a class="btn btn-gh btn-sm" href="#evidence">View logs</a>
          <a class="btn btn-gh btn-sm" href="#sessions" style="margin-left:6px">Sessions</a>
        </div>
      </div>`;
    }).join('');
  }

  $('#hp-refresh').addEventListener('click', load);
  await load();
})();
</script>
