services:

  # ═══════════════════════════════════════════════════════════════════════════
  # COUCHE C1 — HONEYPOTS
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── HONEYPOT SSH/TELNET ──────────────────────────────────────────────────
  # Cowrie simule un serveur Linux/UNIX vulnérable (bannières, FS factice,
  # honeytokens) pour piéger et tracer les attaquants tentant un accès shell.
  # Ports : 2222 (SSH), 2223 (Telnet) — exposés sur l'hôte.
  # Réseau : honeypot-net uniquement (isolation sécurité).
  cowrie:
    image: cowrie/cowrie:latest
    container_name: forenhive-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - ./honeypots/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypots/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
    networks:
      - honeypot-net
    environment:
      - COWRIE_TELNET_ENABLED=yes

  # ─── HONEYPOT MULTI-PROTOCOLES MALWARE ────────────────────────────────────
  # Dionaea capture les payloads sur 11 protocoles (SMB, MSSQL, HTTP, MySQL,
  # FTP, MQTT, SIP…) — vecteur principal de capture de malware (EternalBlue,
  # WannaCry et autres exploits réseau). Stocke binaires dans dionaea.sqlite.
  dionaea:
    image: dinotools/dionaea:latest
    container_name: forenhive-dionaea
    restart: unless-stopped
    ports:
      - "23:23"
      - "80:80"
      - "135:135"
      - "443:443"
      - "445:445"
      - "1433:1433"
      - "1723:1723"
      - "1883:1883"
      - "3306:3306"
      - "11211:11211"
      - "27017:27017"
    volumes:
      - dionaea-logs:/opt/dionaea/var/log
      - dionaea-malware:/opt/dionaea/var/lib/dionaea
      - ./honeypots/dionaea/smb.yaml:/opt/dionaea/template/etc/dionaea/services-enabled/smb.yaml:ro
      - ./honeypots/dionaea/mssql.yaml:/opt/dionaea/template/etc/dionaea/services-enabled/mssql.yaml:ro
    environment:
      - DIONAEA_FORCE_INIT_DATA=1
    networks:
      - honeypot-net

  # ─── HONEYPOT HTTP LLM (Mistral) ──────────────────────────────────────────
  # Galah simule un serveur web crédible : Mistral 7B (via Ollama) génère à
  # la volée des réponses HTTP réalistes (headers, body, codes). Détecte les
  # attaques web sans signature préalable (zero-day web).
  # Ports : 8080, 8888.
  galah:
    build: ./honeypots/galah/galah-src
    container_name: forenhive-galah
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8888:8888"
    networks:
      - honeypot-net
      - backend-net
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=${OLLAMA_MODEL:-mistral}
      - LLM_SERVER_URL=http://${OLLAMA_HOST:-forenhive-ollama}:${OLLAMA_PORT:-11434}
    command:
      - --event-log-file=/app/logs/event_log.json
      - --cache-db-file=/app/logs/cache.db
    volumes:
      - galah-logs:/app/logs
    depends_on:
      - ollama

  # ─── IDS RÉSEAU PASSIF ────────────────────────────────────────────────────
  # Zeek analyse tout le trafic en mode passif (network_mode: host) sur
  # l'interface ZEEK_INTERFACE (défaut: eno12399). Produit des logs riches
  # (conn, notice, weird, ntlm, http, ssl) consommés par Filebeat.
  # Nécessite cap_add NET_ADMIN + NET_RAW pour la capture.
  zeek:
    image: zeek/zeek:latest
    container_name: forenhive-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - zeek-logs:/usr/local/zeek/logs
      - zeek-spool:/usr/local/zeek/spool
      - ./honeypots/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
    command: >
      sh -c "sed -i 's/interface=eth0/interface=${ZEEK_INTERFACE:-eno12399}/g'
      /usr/local/zeek/etc/node.cfg &&
      zeekctl deploy &&
      tail -f /dev/null"

  # ═══════════════════════════════════════════════════════════════════════════
  # COUCHE C2 — PIPELINE ETL (Filebeat → Logstash → Elasticsearch)
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── COLLECTEUR DE LOGS ───────────────────────────────────────────────────
  # Filebeat tail tous les logs honeypot (montés en read-only) et les
  # envoie à Logstash sur le port 5044 pour normalisation ECS.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: forenhive-filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./pipeline/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - cowrie-var:/var/log/cowrie:ro
      - dionaea-logs:/var/log/dionaea:ro
      - zeek-logs:/var/log/zeek:ro
      - zeek-spool:/usr/local/zeek/spool:ro
      - galah-logs:/var/log/galah:ro
    networks:
      - honeypot-net
      - backend-net
    depends_on:
      - logstash

  # ─── NORMALISATION & ENRICHISSEMENT ───────────────────────────────────────
  # Logstash parse les logs bruts (grok), normalise au format ECS, enrichit
  # avec GeoIP MaxMind, et indexe dans Elasticsearch en indices journaliers
  # (honeypot-logs-YYYY.MM.dd). Heap par défaut : 512m.
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: forenhive-logstash
    restart: unless-stopped
    volumes:
      - ./pipeline/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./pipeline/logstash/pipelines:/usr/share/logstash/pipeline
      - ./geoip/GeoLite2-City.mmdb:/usr/share/logstash/GeoLite2-City.mmdb:ro
    ports:
      - "5044:5044"
    networks:
      - backend-net
    environment:
      - LS_JAVA_OPTS=${LS_JAVA_OPTS:--Xms512m -Xmx512m}
    depends_on:
      - elasticsearch

  # ═══════════════════════════════════════════════════════════════════════════
  # COUCHE C2 (suite) — STOCKAGE DUAL
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── STOCKAGE LOGS + RECHERCHE ────────────────────────────────────────────
  # Elasticsearch 8.13 mode single-node, sécurité désactivée (réseau interne
  # backend-net uniquement, port 9200 bindé à 127.0.0.1). Heap 1g par défaut.
  # Stocke : honeypot-logs-* (ETL) + forenhive-suspect-profiles (mémoire BAU).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: forenhive-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      - network.host=0.0.0.0
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - backend-net

  # ─── STOCKAGE FORENSIQUE STRUCTURÉ ────────────────────────────────────────
  # PostgreSQL 15 contient les 4+ tables forensiques métier :
  #   forensic_sessions, file_analysis, forensic_iocs,
  #   forensic_chain_of_custody, forensic_coc_batches, suspect_profiles,
  #   ip_enrichment_cache, ip_risk_scores, users, audit_log…
  # Réseau backend-net uniquement, pas de port exposé sur l'hôte.
  postgresql:
    image: postgres:15
    container_name: forenhive-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-forenhive}
      - POSTGRES_USER=${POSTGRES_USER:-forenhive}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - backend-net

  # ═══════════════════════════════════════════════════════════════════════════
  # COUCHE C3 — FORENSIC ENGINE
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── MOTEUR D'ANALYSE FORENSIQUE ──────────────────────────────────────────
  # 11 modules Python orchestrés par engine.py. Tourne en cron interne +
  # expose un mini-serveur HTTP sur :8001 (status/healthcheck).
  # Lit dionaea-malware + zeek-logs en read-only, écrit dans PG.
  forensic-engine:
    build: ./forensic-engine
    container_name: forenhive-forensic-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - dionaea-malware:/opt/dionaea/var/lib/dionaea:ro
      - zeek-logs:/usr/local/zeek/logs:ro
      - ./forensic-engine/yara_rules:/app/yara_rules:ro
      - ./geoip/GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb:ro
      - ./geoip/GeoLite2-ASN.mmdb:/app/GeoLite2-ASN.mmdb:ro
    networks:
      - backend-net
    env_file:
      - .env
    environment:
      - PG_HOST=forenhive-postgresql
      - PG_PORT=${POSTGRES_PORT:-5432}
      - PG_DB=${POSTGRES_DB:-forenhive}
      - PG_USER=${POSTGRES_USER:-forenhive}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - ABUSEIPDB_KEY=${ABUSEIPDB_API_KEY}
      - VIRUSTOTAL_KEY=${VIRUSTOTAL_API_KEY}
      - ENGINE_INTERVAL_MINUTES=5
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WA_NUMBER=${TWILIO_WA_NUMBER}
      - DEST_WA=${DEST_WA}
    depends_on:
      - elasticsearch
      - postgresql

  # ═══════════════════════════════════════════════════════════════════════════
  # COUCHE C4 — BACKEND + FRONTEND + REPORTING
  # ═══════════════════════════════════════════════════════════════════════════

  # ─── API REST FastAPI ─────────────────────────────────────────────────────
  # Backend FastAPI async (SQLAlchemy + Elasticsearch + Ollama).
  # 13 routers : auth, chat, attacks, sessions, geo, alerts, profiling,
  # reports, risk_score, forensics, honeypots, audit.
  # Healthcheck /health, JWT auth (clé JWT_SECRET), CORS configurable.
  # Bind-mount sur yara_rules/ pour exposer le vrai compte de règles dans
  # le rapport PDF (au lieu du hardcoded 10).
  forenhive-backend:
    build: ./backend
    container_name: forenhive-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ES_HOST=http://forenhive-elasticsearch:9200
      - OLLAMA_HOST=http://forenhive-ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral:latest}
      - OLLAMA_TIMEOUT=300
      - REPORTS_DIR=/reports
      - PG_HOST=forenhive-postgresql
      - PG_PORT=${POSTGRES_PORT:-5432}
      - PG_DB=${POSTGRES_DB:-forenhive}
      - PG_USER=${POSTGRES_USER:-forenhive}
      - PG_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@forenhive.local}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe!2026}
      - FORENSIC_ENGINE_URL=http://forensic-engine:8001
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:9000,http://127.0.0.1:9000,http://172.16.1.100,http://172.16.1.100:9000,http://172.16.1.100:3000}
    ports:
      - "8000:8000"
    volumes:
      - reports-data:/reports
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only mount of the engine's YARA rule directory so the report
      # adapter can display the real ruleset size (M-6) instead of a
      # hardcoded 10. Bind-mount, not a named volume: the count must
      # reflect what the engine actually loads on the host.
      - ./forensic-engine/yara_rules:/app/yara_rules:ro
    networks:
      - backend-net
    depends_on:
      - postgresql
      - elasticsearch
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── LLM LOCAL (Mistral 7B, CPU-only) ─────────────────────────────────────
  # Ollama sert Mistral 7B Q4_K_M (4.4 Go) sur le port 11434 (réseau interne).
  # Utilisé par : profiler.py (analyse criminologique), mitre_mapper.py
  # (narration tactique), galah (réponses HTTP simulées).
  # CPU-only — pas de GPU sur le R750. Temp=0.3, ctx=8192 (immuable).
  ollama:
    image: ollama/ollama:latest
    container_name: forenhive-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - backend-net

  # ─── SPA (Vite build → nginx + HTTPS) ─────────────────────────────────────
  # Frontend Vite/React buildé en multi-stage Docker, servi par nginx
  # (HTTP:3000 + HTTPS:3443 avec cert auto-signé pour téléchargement PDF).
  # Le SPA est composé de partiels pages/*.html chargés dynamiquement.
  forenhive-frontend:
    build: ./frontend
    container_name: forenhive-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3443:443"
    networks:
      - backend-net
    depends_on:
      - forenhive-backend

# ═══════════════════════════════════════════════════════════════════════════
# RÉSEAUX
# ═══════════════════════════════════════════════════════════════════════════
# honeypot-net : ISOLATION — uniquement les honeypots + collecte.
#                Les attaquants ne peuvent JAMAIS atteindre le backend depuis ce réseau.
# backend-net  : ETL + stockages + analytique + backend + LLM.
networks:
  honeypot-net:
    name: honeypot-net
    driver: bridge
  backend-net:
    name: backend-net
    driver: bridge

# ═══════════════════════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════════════════════
# Volumes "external" : créés par les stacks initiales (sprint 1/2), réutilisés
# ici par référence directe au nom Docker. NE PAS supprimer les noms longs
# (hex) — ce sont les volumes existants persistant les données honeypot.
volumes:
  cowrie-var:
    external: true
    name: bb474ddc3d2a3f3026c85d4c2fe7f1c5723f2e68f8ba60a05e4c9bb4471292ce
  dionaea-logs:
    external: true
    name: dionaea_dionaea-logs
  dionaea-malware:
    external: true
    name: dionaea_dionaea-malware
  zeek-logs:
    external: true
    name: zeek_zeek-logs
  elasticsearch-data:
  postgresql-data:
  reports-data:
  ollama-models:
    external: true
    name: llm_ollama-models
  galah-logs:
  zeek-spool:
