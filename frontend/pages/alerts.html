<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Monitoring</div>
    <h2 class="page-title">Alerts <span>/ Incidents</span></h2>
    <div class="page-sub">Alerts generated by the ForenHive engine · <span id="al-count">—</span> total · <span id="al-crit">—</span> critical.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gh btn-sm" id="al-refresh"> Refresh</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi r"><div class="kpi-label">Critical</div><div class="kpi-val" id="kpi-crit">—</div><div class="kpi-delta">immediate priority</div></div>
  <div class="kpi g"><div class="kpi-label">High</div><div class="kpi-val" id="kpi-high">—</div><div class="kpi-delta">to analyze</div></div>
  <div class="kpi b"><div class="kpi-label">Medium / Low</div><div class="kpi-val" id="kpi-low">—</div><div class="kpi-delta">monitoring</div></div>
  <div class="kpi p"><div class="kpi-label">Last 24h</div><div class="kpi-val" id="kpi-24h">—</div><div class="kpi-delta">recent activity</div></div>
</div>

<div class="card">
  <div class="card-h">
    <div class="card-t">Alert History</div>
    <div class="card-sub">Level · timestamp · context</div>
  </div>
  <table class="tbl">
    <thead><tr>
      <th style="width:90px">Level</th><th>Title</th><th>Source</th>
      <th>IP / Session</th><th>Date</th><th>Status</th>
    </tr></thead>
    <tbody id="al-rows"><tr><td colspan="6">Loading…</td></tr></tbody>
  </table>
</div>

<script>
(async function(){
  const { fmt, esc, $ } = FH;

  function badge(level) {
    const l = (level || '').toUpperCase();
    if (l === 'CRITICAL') return '<span class="badge red"> CRITICAL</span>';
    if (l === 'HIGH')     return '<span class="badge gold"> HIGH</span>';
    if (l === 'MEDIUM')   return '<span class="badge blue"> MEDIUM</span>';
    if (l === 'LOW')      return '<span class="badge teal"> LOW</span>';
    return '<span class="badge gray">' + esc(l || '—') + '</span>';
  }

  async function load() {
    try {
      const list = await api.alertHistory({});
      const items = Array.isArray(list) ? list : (list.items || []);
      const counts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0 };
      const dayAgo = Date.now() - 86400000;
      let last24 = 0;
      items.forEach(a => {
        const lvl = (a.level || '').toUpperCase();
        if (counts[lvl] != null) counts[lvl]++;
        const t = +new Date(a.created_at || a.timestamp || 0);
        if (t > dayAgo) last24++;
      });
      $('#kpi-crit').textContent = counts.CRITICAL;
      $('#kpi-high').textContent = counts.HIGH;
      $('#kpi-low').textContent  = counts.MEDIUM + counts.LOW;
      $('#kpi-24h').textContent  = last24;
      $('#al-count').textContent = items.length;
      $('#al-crit').textContent  = counts.CRITICAL;

      if (!items.length) {
        $('#al-rows').innerHTML = `<tr><td colspan="6"><div class="alert info"><b>No alerts recorded.</b><br>Alerts appear when the engine detects a risk ≥ the defined threshold.</div></td></tr>`;
        return;
      }
      $('#al-rows').innerHTML = items.map(a => {
        const ctx = a.context || a.metadata || {};
        const sid = ctx.session_id || a.session_id;
        const ip  = ctx.source_ip  || a.source_ip;
        return `<tr>
          <td>${badge(a.level)}</td>
          <td><b>${esc(a.title || a.message || '—')}</b><div class="card-sub" style="font-size:10px">${esc(a.message || '')}</div></td>
          <td>${esc(a.source || a.kind || 'engine')}</td>
          <td class="mono" style="font-size:11px">${esc(ip || '—')}${sid?'<br>'+esc(sid):''}</td>
          <td class="mono" style="font-size:11px">${fmt.date(a.created_at || a.timestamp)}</td>
          <td><span class="badge ${a.acknowledged?'teal':'gold'}">${a.acknowledged?'Acknowledged':'Open'}</span></td>
        </tr>`;
      }).join('');
    } catch (e) {
      $('#al-rows').innerHTML = `<tr><td colspan="6"><div class="alert err">${esc(e.message)}</div></td></tr>`;
    }
  }
  $('#al-refresh').addEventListener('click', load);
  await load();
})();
</script>
