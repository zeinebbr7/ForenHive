<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Monitoring</div>
    <h2 class="page-title">Alerts <span>/ Incidents</span></h2>
    <div class="page-sub">Alerts generated by the ForenHive engine · <span id="al-count">—</span> total · <span id="al-crit">—</span> critical.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gh btn-sm" id="al-refresh"> Refresh</button>
  </div>
</div>

<div id="alerts-root" style="width:100%">
  <div class="alert info" style="margin:20px 0">Loading alerts…</div>
</div>

<style>
.al-tooltip {
  background: #0d111e !important;
  border: 1px solid #1e2538 !important;
  border-radius: 6px !important;
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 11px !important;
  color: #e0e6f0 !important;
  padding: 8px 12px !important;
}
.recharts-default-legend { padding-top: 8px !important; }
.recharts-legend-item-text { font-family: 'JetBrains Mono', monospace !important; font-size: 11px !important; }
.al-kpi-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.al-kpi { flex:1; min-width:140px; background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
.al-kpi-label { font-size:10px; color:var(--text3); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; font-family:'JetBrains Mono',monospace; }
.al-kpi-val { font-family:'Rajdhani',sans-serif; font-size:32px; font-weight:700; line-height:1; }
.al-kpi-sub { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; margin-top:4px; }
.al-chart-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:18px 20px; }
.al-chart-title { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; color:var(--text1); margin-bottom:2px; }
.al-chart-sub { font-size:11px; color:var(--text3); font-family:'JetBrains Mono',monospace; margin-bottom:14px; }
.al-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.al-legend { display:flex; flex-direction:column; gap:8px; }
.al-legend-row { display:flex; align-items:center; gap:10px; }
.al-legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.al-legend-label { font-size:12px; flex:1; }
.al-legend-val { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text2); }
.al-split-wrap { display:flex; align-items:center; gap:24px; }
.al-table-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-top:0; }
@media (max-width: 900px) { .al-grid-2 { grid-template-columns: 1fr; } }
</style>

<script>
(async function(){
  const { fmt, esc, $, flag } = FH;
  const R  = window.React;
  const RD = window.ReactDOM;
  const RC = window.Recharts;

  if (!R || !RD || !RC) {
    document.getElementById('alerts-root').innerHTML =
      '<div class="alert err">Recharts failed to load — check vendor scripts.</div>';
    return;
  }

  const h = R.createElement;

  const SEV_COLORS = {
    critical: '#ff5050',
    high:     '#ff9933',
    medium:   '#f59e0b',
    low:      '#2dd4bf',
  };
  const SEV_ORDER  = ['low', 'medium', 'high', 'critical'];
  const SEV_LABELS = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' };

  const TOOLTIP_STYLE = {
    backgroundColor: '#0d111e',
    border: '1px solid #1e2538',
    borderRadius: '6px',
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: '11px',
    color: '#e0e6f0',
  };
  const AXIS_TICK = { fontSize: 10, fill: '#8892a4', fontFamily: "'JetBrains Mono', monospace" };

  function badge(sev) {
    const s = (sev || '').toUpperCase();
    if (s === 'CRITICAL') return '<span class="badge red"> CRITICAL</span>';
    if (s === 'HIGH')     return '<span class="badge gold"> HIGH</span>';
    if (s === 'MEDIUM')   return '<span class="badge blue"> MEDIUM</span>';
    if (s === 'LOW')      return '<span class="badge teal"> LOW</span>';
    return '<span class="badge gray">' + esc(s || '—') + '</span>';
  }

  async function fetchAlerts() {
    const res = await api.alertHistory({ limit: 500 });
    return Array.isArray(res) ? res : (res.items || []);
  }

  let globalItems = [];
  let globalError = null;

  /* ── Main React component ──────────────────────────────────── */
  function AlertsApp({ items, error }) {

    if (error) {
      return h('div', { className: 'alert err' },
        'Failed to load alerts: ' + error.message);
    }

    /* ── Derived stats ─────────────────────────────────────── */
    const dayAgo = Date.now() - 86400000;
    const bySev = { critical: 0, high: 0, medium: 0, low: 0 };
    let last24 = 0;
    items.forEach(a => {
      const s = (a.severity || 'low').toLowerCase();
      if (s in bySev) bySev[s]++;
      if (+new Date(a.timestamp || 0) > dayAgo) last24++;
    });
    const sevTotal = items.length || 1;

    // sync header text
    try { document.getElementById('al-count').textContent = items.length; } catch(_) {}
    try { document.getElementById('al-crit').textContent  = bySev.critical; } catch(_) {}

    /* ── Severity donut data ────────────────────────────────── */
    const sevData = ['critical','high','medium','low'].map(k => ({
      name:  SEV_LABELS[k],
      value: bySev[k],
      color: SEV_COLORS[k],
    }));

    /* ── Timeline: last 14 days stacked bar ─────────────────── */
    const dayLabels = [];
    const dayMap   = {};
    for (let i = 13; i >= 0; i--) {
      const d   = new Date(Date.now() - i * 86400000);
      const key = d.toISOString().slice(0, 10);
      const lbl = (d.getMonth() + 1) + '/' + d.getDate();
      dayLabels.push({ key, lbl });
      dayMap[key] = { date: lbl, critical: 0, high: 0, medium: 0, low: 0 };
    }
    items.forEach(a => {
      const day = (a.timestamp || '').slice(0, 10);
      if (dayMap[day]) {
        const s = (a.severity || 'low').toLowerCase();
        if (s in dayMap[day]) dayMap[day][s]++;
      }
    });
    const timelineData = dayLabels.map(({ key }) => dayMap[key]);

    /* ── Top offending IPs ──────────────────────────────────── */
    const byIp = {};
    const sevRank = { critical: 4, high: 3, medium: 2, low: 1 };
    items.forEach(a => {
      const ip = a.source_ip;
      if (!ip) return;
      if (!byIp[ip]) byIp[ip] = { count: 0, maxSev: 'low', country: a.country };
      byIp[ip].count++;
      const s = (a.severity || 'low').toLowerCase();
      if ((sevRank[s] || 0) > (sevRank[byIp[ip].maxSev] || 0)) byIp[ip].maxSev = s;
      if (!byIp[ip].country && a.country) byIp[ip].country = a.country;
    });
    const topIpsData = Object.entries(byIp)
      .sort((a, b) => b[1].count - a[1].count)
      .slice(0, 8)
      .map(([ip, d]) => ({
        ip:    (d.country ? flag(d.country) + ' ' : '') + ip,
        count: d.count,
        color: SEV_COLORS[d.maxSev] || '#8892a4',
      }));

    /* ── Top MITRE techniques ───────────────────────────────── */
    const mitreCount = {};
    items.forEach(a => {
      (a.mitre_tags || []).forEach(t => {
        mitreCount[t] = (mitreCount[t] || 0) + 1;
      });
    });
    const topMitre = Object.entries(mitreCount)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 8)
      .map(([id, count]) => ({ id, count }));

    const noData = items.length === 0;
    const noDataMsg = h('div', {
      className: 'alert info',
      style: { marginTop: 12 },
    }, 'No alerts yet — will populate once the forensic engine scores sessions ≥ 60 (HIGH / CRITICAL).');

    /* ── KPI row ────────────────────────────────────────────── */
    const kpiRow = h('div', { className: 'al-kpi-row' },
      h('div', { className: 'al-kpi', style: { borderColor: '#ff505044' } },
        h('div', { className: 'al-kpi-label' }, 'Critical'),
        h('div', { className: 'al-kpi-val', style: { color: '#ff5050' } }, bySev.critical),
        h('div', { className: 'al-kpi-sub' }, 'immediate priority')
      ),
      h('div', { className: 'al-kpi', style: { borderColor: '#ff993344' } },
        h('div', { className: 'al-kpi-label' }, 'High'),
        h('div', { className: 'al-kpi-val', style: { color: '#ff9933' } }, bySev.high),
        h('div', { className: 'al-kpi-sub' }, 'to analyze')
      ),
      h('div', { className: 'al-kpi', style: { borderColor: '#2dd4bf44' } },
        h('div', { className: 'al-kpi-label' }, 'Medium / Low'),
        h('div', { className: 'al-kpi-val', style: { color: '#2dd4bf' } }, bySev.medium + bySev.low),
        h('div', { className: 'al-kpi-sub' }, 'monitoring')
      ),
      h('div', { className: 'al-kpi', style: { borderColor: 'var(--border2, var(--border))' } },
        h('div', { className: 'al-kpi-label' }, 'Last 24h'),
        h('div', { className: 'al-kpi-val', style: { color: 'var(--gold)' } }, last24),
        h('div', { className: 'al-kpi-sub' }, 'recent activity')
      )
    );

    /* ── Severity donut card ────────────────────────────────── */
    const sevCard = h('div', { className: 'al-chart-card' },
      h('div', { className: 'al-chart-title' }, 'Severity Breakdown'),
      h('div', { className: 'al-chart-sub' }, 'Distribution by priority level'),
      noData ? noDataMsg :
      h('div', { className: 'al-split-wrap' },
        h(RC.PieChart, { width: 160, height: 160 },
          h(RC.Pie, {
            data: sevData, dataKey: 'value', nameKey: 'name',
            cx: 75, cy: 75, innerRadius: 46, outerRadius: 68,
            paddingAngle: 2,
          },
            ...sevData.map((e, i) =>
              h(RC.Cell, { key: i, fill: e.color + 'cc', stroke: e.color, strokeWidth: 1 })
            )
          ),
          h(RC.Tooltip, { contentStyle: TOOLTIP_STYLE })
        ),
        h('div', { className: 'al-legend', style: { flex: 1 } },
          ...sevData.map((e, i) =>
            h('div', { key: i, className: 'al-legend-row' },
              h('span', { className: 'al-legend-dot', style: { background: e.color } }),
              h('span', { className: 'al-legend-label' }, e.name),
              h('span', { className: 'al-legend-val' },
                e.value + ' (' + ((e.value / sevTotal) * 100).toFixed(0) + '%)')
            )
          )
        )
      )
    );

    /* ── Timeline stacked bar ───────────────────────────────── */
    const timelineCard = h('div', { className: 'al-chart-card' },
      h('div', { className: 'al-chart-title' }, 'Alerts Over Time'),
      h('div', { className: 'al-chart-sub' }, 'Last 14 days · stacked by severity'),
      noData ? noDataMsg :
      h(RC.ResponsiveContainer, { width: '100%', height: 200 },
        h(RC.BarChart, { data: timelineData, margin: { top: 4, right: 8, bottom: 0, left: -10 } },
          h(RC.CartesianGrid, { strokeDasharray: '3 3', stroke: 'rgba(255,255,255,0.05)', vertical: false }),
          h(RC.XAxis, { dataKey: 'date', tick: AXIS_TICK, tickLine: false, axisLine: false }),
          h(RC.YAxis, { tick: AXIS_TICK, tickLine: false, axisLine: false, allowDecimals: false }),
          h(RC.Tooltip, { contentStyle: TOOLTIP_STYLE }),
          h(RC.Legend, { iconSize: 8, wrapperStyle: { fontSize: '11px', fontFamily: "'JetBrains Mono', monospace", paddingTop: '8px' } }),
          ...SEV_ORDER.map((k, idx) =>
            h(RC.Bar, {
              key: k, dataKey: k, stackId: 'a',
              fill: SEV_COLORS[k] + 'cc',
              stroke: SEV_COLORS[k], strokeWidth: 1,
              name: SEV_LABELS[k],
              radius: idx === SEV_ORDER.length - 1 ? [2, 2, 0, 0] : [0, 0, 0, 0],
            })
          )
        )
      )
    );

    /* ── Top IPs horizontal bar ─────────────────────────────── */
    const topIpsCard = h('div', { className: 'al-chart-card' },
      h('div', { className: 'al-chart-title' }, 'Top Offending IPs'),
      h('div', { className: 'al-chart-sub' }, 'IPs with the most triggered alerts'),
      topIpsData.length === 0 ? noDataMsg :
      h(RC.ResponsiveContainer, { width: '100%', height: Math.max(160, topIpsData.length * 30 + 20) },
        h(RC.BarChart, { data: topIpsData, layout: 'vertical', margin: { top: 0, right: 20, bottom: 0, left: 0 } },
          h(RC.CartesianGrid, { strokeDasharray: '3 3', stroke: 'rgba(255,255,255,0.05)', horizontal: false }),
          h(RC.XAxis, { type: 'number', tick: AXIS_TICK, tickLine: false, axisLine: false, allowDecimals: false }),
          h(RC.YAxis, { type: 'category', dataKey: 'ip', width: 165, tick: { ...AXIS_TICK, fill: '#e0e6f0' }, tickLine: false, axisLine: false }),
          h(RC.Tooltip, { contentStyle: TOOLTIP_STYLE, formatter: v => [v + ' alerts', 'Count'] }),
          h(RC.Bar, { dataKey: 'count', name: 'Alerts', radius: [0, 3, 3, 0], barSize: 16 },
            ...topIpsData.map((e, i) =>
              h(RC.Cell, { key: i, fill: e.color + 'bb' })
            )
          )
        )
      )
    );

    /* ── MITRE techniques horizontal bar ────────────────────── */
    const mitreCard = h('div', { className: 'al-chart-card' },
      h('div', { className: 'al-chart-title' }, 'Top MITRE Techniques'),
      h('div', { className: 'al-chart-sub' }, 'Most frequent ATT&CK IDs across all alerts'),
      topMitre.length === 0 ? noDataMsg :
      h(RC.ResponsiveContainer, { width: '100%', height: Math.max(160, topMitre.length * 30 + 20) },
        h(RC.BarChart, { data: topMitre, layout: 'vertical', margin: { top: 0, right: 20, bottom: 0, left: 0 } },
          h(RC.CartesianGrid, { strokeDasharray: '3 3', stroke: 'rgba(255,255,255,0.05)', horizontal: false }),
          h(RC.XAxis, { type: 'number', tick: AXIS_TICK, tickLine: false, axisLine: false, allowDecimals: false }),
          h(RC.YAxis, { type: 'category', dataKey: 'id', width: 110, tick: { ...AXIS_TICK, fill: '#b464ff' }, tickLine: false, axisLine: false }),
          h(RC.Tooltip, { contentStyle: TOOLTIP_STYLE, formatter: v => [v + ' alerts', 'Count'] }),
          h(RC.Bar, { dataKey: 'count', name: 'Alerts', radius: [0, 3, 3, 0], barSize: 16, fill: '#b464ffbb' })
        )
      )
    );

    /* ── Alert table ────────────────────────────────────────── */
    const tableCard = h('div', { className: 'al-table-card' },
      h('div', { className: 'al-chart-title', style: { marginBottom: 12 } }, 'Alert History'),
      items.length === 0
        ? h('div', { className: 'alert info' },
            h('b', null, 'No alerts recorded.'),
            h('br'),
            'Alerts appear when the forensic engine detects sessions with risk score ≥ 60.'
          )
        : h('table', { className: 'tbl' },
            h('thead', null,
              h('tr', null,
                h('th', { style: { width: 90 } }, 'Level'),
                h('th', null, 'Threat type'),
                h('th', null, 'Source IP'),
                h('th', null, 'Honeypot'),
                h('th', null, 'Score'),
                h('th', null, 'MITRE'),
                h('th', null, 'Date'),
                h('th', null, 'Email'),
              )
            ),
            h('tbody', null,
              ...items.slice(0, 100).map((a, i) =>
                h('tr', { key: a.id || i },
                  h('td', { dangerouslySetInnerHTML: { __html: badge(a.severity) } }),
                  h('td', null, h('b', null, a.threat_type || '—')),
                  h('td', { className: 'mono', style: { fontSize: 11 } },
                    (a.country ? flag(a.country) + ' ' : '') + (a.source_ip || '—')
                  ),
                  h('td', null, a.honeypot || '—'),
                  h('td', null,
                    h('span', {
                      style: {
                        fontFamily: "'JetBrains Mono', monospace",
                        fontSize: 12, fontWeight: 700,
                        color: a.risk_score >= 70 ? '#ff5050'
                             : a.risk_score >= 45 ? '#ff9933'
                             : '#8892a4',
                      }
                    }, a.risk_score ?? '—')
                  ),
                  h('td', { style: { fontSize: 10, fontFamily: "'JetBrains Mono', monospace", color: '#b464ff' } },
                    (a.mitre_tags || []).slice(0, 3).join(', ') || '—'
                  ),
                  h('td', { className: 'mono', style: { fontSize: 11 } }, fmt.date(a.timestamp)),
                  h('td', null,
                    h('span', { className: 'badge ' + (a.dispatched ? 'teal' : 'gray') },
                      a.dispatched ? 'Sent' : 'Pending')
                  )
                )
              )
            )
          )
    );

    return h('div', null,
      kpiRow,
      h('div', { className: 'al-grid-2' }, sevCard, timelineCard),
      h('div', { className: 'al-grid-2' }, topIpsCard, mitreCard),
      tableCard
    );
  }

  /* ── Bootstrap ─────────────────────────────────────────────── */
  try {
    globalItems = await fetchAlerts();
  } catch (e) {
    globalError = e;
  }

  const root = RD.createRoot(document.getElementById('alerts-root'));
  const render = () => root.render(h(AlertsApp, { items: globalItems, error: globalError }));
  render();

  window.__pageCleanup = () => root.unmount();

  document.getElementById('al-refresh').addEventListener('click', async () => {
    try {
      globalItems = await fetchAlerts();
      globalError = null;
    } catch (e) {
      globalError = e;
    }
    render();
  });
})();
</script>
