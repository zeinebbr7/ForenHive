<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Access Control</div>
    <h2 class="page-title">Contrôle <span>d'accès</span></h2>
    <div class="page-sub">Système RBAC — JWT tokens  Rôles : <span class="mono">ADMIN</span>, <span class="mono">ANALYST</span>, <span class="mono">VIEWER</span>.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gold btn-sm" id="ac-add"> Ajouter un utilisateur</button>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi g"><div class="kpi-label">Utilisateurs</div><div class="kpi-val" id="kpi-total">—</div><div class="kpi-delta">comptes enregistrés</div></div>
  <div class="kpi r"><div class="kpi-label">Admins</div><div class="kpi-val" id="kpi-admin">—</div><div class="kpi-delta">accès complet</div></div>
  <div class="kpi b"><div class="kpi-label">Analystes</div><div class="kpi-val" id="kpi-analyst">—</div><div class="kpi-delta">lecture + actions</div></div>
  <div class="kpi p"><div class="kpi-label">Viewers</div><div class="kpi-val" id="kpi-viewer">—</div><div class="kpi-delta">lecture seule</div></div>
</div>

<div class="card">
  <div class="card-h">
    <div class="card-t">Utilisateurs</div>
    <div class="card-sub">Liste des comptes  rôle  activité</div>
  </div>
  <table class="tbl">
    <thead><tr>
      <th>Email</th><th>Rôle</th><th>Créé</th><th>Dernière connexion</th><th>Statut</th>
    </tr></thead>
    <tbody id="ac-rows"><tr><td colspan="5">Chargement…</td></tr></tbody>
  </table>
</div>

<script>
(async function(){
  const { fmt, esc, $ } = FH;

  function roleBadge(r) {
    const role = (r || '').toLowerCase();
    if (role === 'admin')   return '<span class="badge red"> ADMIN</span>';
    if (role === 'analyst') return '<span class="badge gold"> ANALYST</span>';
    if (role === 'viewer')  return '<span class="badge blue"> VIEWER</span>';
    return '<span class="badge gray">'+esc(role||'—')+'</span>';
  }

  async function load() {
    try {
      const list = await api.users();
      const items = Array.isArray(list) ? list : (list.items || []);
      $('#kpi-total').textContent = items.length;
      const counts = { admin:0, analyst:0, viewer:0 };
      items.forEach(u => { const r=(u.role||'').toLowerCase(); if (counts[r]!=null) counts[r]++; });
      $('#kpi-admin').textContent   = counts.admin;
      $('#kpi-analyst').textContent = counts.analyst;
      $('#kpi-viewer').textContent  = counts.viewer;

      if (!items.length) {
        $('#ac-rows').innerHTML = `<tr><td colspan="5"><div class="alert info">Aucun utilisateur — l'admin bootstrap est créé au premier démarrage du backend.</div></td></tr>`;
        return;
      }
      $('#ac-rows').innerHTML = items.map(u => `<tr>
        <td><b>${esc(u.email)}</b></td>
        <td>${roleBadge(u.role)}</td>
        <td class="mono" style="font-size:11px">${fmt.date(u.created_at)}</td>
        <td class="mono" style="font-size:11px">${u.last_login ? fmt.date(u.last_login) : '—'}</td>
        <td><span class="badge ${u.is_active===false?'gray':'teal'}">${u.is_active===false?'Désactivé':'Actif'}</span></td>
      </tr>`).join('');
    } catch (e) {
      $('#ac-rows').innerHTML = `<tr><td colspan="5"><div class="alert err">${esc(e.message)} — la gestion utilisateurs requiert le rôle ADMIN.</div></td></tr>`;
    }
  }

  $('#ac-add').addEventListener('click', () => {
    if (typeof openModal !== 'function') {
      alert('Création utilisateur — disponible via API : POST /api/auth/users');
      return;
    }
    openModal(`
      <div class="modal-h"><div class="card-t">Nouvel utilisateur</div><button class="drawer-close" onclick="closeModal()"></button></div>
      <div class="alert info">Création utilisateur — endpoint backend à exposer (POST /api/auth/users). Bouton en place pour démo.</div>
      <div class="flex gap-8" style="justify-content:flex-end;margin-top:12px">
        <button class="btn btn-gh btn-sm" onclick="closeModal()">Fermer</button>
      </div>
    `);
  });

  await load();
})();
</script>
