services:
  dionaea:
    image: dinotools/dionaea:latest
    container_name: forenhive-dionaea
    restart: unless-stopped
    ports:
      - "23:23"         # Telnet
      - "80:80"         # HTTP
      - "135:135"       # EPMAP
      - "443:443"       # HTTPS
      - "445:445"       # SMB
      - "1433:1433"     # MSSQL
      - "1723:1723"     # PPTP
      - "1883:1883"     # MQTT
      - "3306:3306"     # MySQL
      - "11211:11211"   # Memcache
      - "27017:27017"   # MongoDB
    volumes:
      - dionaea-logs:/opt/dionaea/var/log
      - dionaea-malware:/opt/dionaea/var/lib/dionaea
    networks:
      - honeypot-net

volumes:
  dionaea-logs:
  dionaea-malware:

networks:
  honeypot-net:
    external: true
