services:
  dionaea:
    image: dinotools/dionaea:latest
    container_name: forenhive-dionaea
    restart: unless-stopped
    ports:
      - "23:23"
      - "80:80"
      - "135:135"
      - "443:443"
      - "445:445"
      - "1433:1433"
      - "1723:1723"
      - "1883:1883"
      - "3306:3306"
      - "11211:11211"
      - "27017:27017"
    volumes:
      - dionaea-logs:/opt/dionaea/var/log
      - dionaea-malware:/opt/dionaea/var/lib/dionaea
    networks:
      - honeypot-net

volumes:
  dionaea-logs:
  dionaea-malware:

networks:
  honeypot-net:
    external: true
