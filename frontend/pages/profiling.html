    'Impact':            { bg:'rgba(201,61,85,.12)',   color:'var(--red2)',        border:'rgba(201,61,85,.35)'  },
    'Initial Access':    { bg:'rgba(140,26,43,.10)',   color:'var(--gold)',        border:'var(--border2)'       },
    'Privilege Escalation':{ bg:'rgba(232,184,75,.08)','color':'var(--yellow)',   border:'rgba(232,184,75,.25)' },
  };

  const DANGER_CMDS = /\b(wget|curl|chmod\s*\+x|bash|python|perl\b|nc\b|ncat|mkfifo|crontab|LD_PRELOAD|nohup)\b|\/dev\/tcp|rm\s+-rf/;

  function deriveKCPhase(mitre) {
    if (!Array.isArray(mitre) || !mitre.length) return null;
    let best = -1, phase = null;
    const KC_ORDER = KC_STEPS.map(s => s.key);
    for (const t of mitre) {
      const id = typeof t === 'object' ? t.id : String(t);
      const pfx = id.slice(0,5);
      for (const [pfxs, ph] of MITRE_KC_MAP) {
        if (pfxs.includes(pfx)) {
          const idx = KC_ORDER.indexOf(ph);
          if (idx > best) { best = idx; phase = ph; }
        }
      }
    }
    return phase;
  }

  function sevFromScore(s) {
    s = Number(s) || 0;
    return s >= 70 ? 'CRITICAL' : s >= 40 ? 'HIGH' : s >= 20 ? 'MEDIUM' : 'LOW';
  }

  function normalize(raw) {
    const p = { ...raw };
    if (!p.source_ip && p.ip) p.source_ip = p.ip;
    if (!p.severity) p.severity = sevFromScore(p.risk_score);
    if (p.organised_score == null && p.organized_score != null) p.organised_score = Number(p.organized_score);
    if (!Array.isArray(p.signature_behaviors) && Array.isArray(p.signature_indicators)) p.signature_behaviors = p.signature_indicators;
    if (!p.behavioral_traits && Array.isArray(p.behavioral_traits)) p.behavioral_traits = p.behavioral_traits;
    if (!p.kill_chain_stage) p.kill_chain_stage = p.kill_chain_phase || deriveKCPhase(p.mitre_techniques);
    if (!p.recidivism && typeof p.similar_past_cases === 'number') {
      p.recidivism = { seen_before: p.similar_past_cases > 0, previous_sessions: p.similar_past_cases };
    }
    // Map new schema events/sessions counts to old field names
    if (!p.event_count && p.events_count != null)     p.event_count   = p.events_count;
    if (!p.session_count && p.sessions_count != null) p.session_count = p.sessions_count;
    // Map honeypots_targeted → honeypots
    if (!p.honeypots && Array.isArray(p.honeypots_targeted)) p.honeypots = p.honeypots_targeted;
    // Flatten enrichment → top-level fields
    if (p.enrichment) {
      const e = p.enrichment;
      if (e.geo) {
        if (!p.country) { p.country = e.geo.country_code; p.country_name = e.geo.country; }
        if (!p.city)    p.city = e.geo.city;
        if (p.lat == null) { p.lat = e.geo.lat; p.lon = e.geo.lon; }
        if (!p.timezone) p.timezone = e.geo.timezone;
      }
      if (e.asn) {
        if (!p.asn)    p.asn    = e.asn.number;
        if (!p.as_org) p.as_org = e.asn.organization;
      }
      if (e.abuse) {
        if (p.abuseipdb_score == null) p.abuseipdb_score = e.abuse.score;
        if (!p.abuse_reports)    p.abuse_reports    = e.abuse.total_reports;
        if (!p.abuse_categories) p.abuse_categories = e.abuse.categories;
      }
      if (e.anonymization) {
        if (p.is_tor   == null) p.is_tor   = e.anonymization.is_tor;
        if (p.is_vpn   == null) p.is_vpn   = e.anonymization.is_vpn;
        if (p.is_proxy == null) p.is_proxy = e.anonymization.is_proxy;
        if (p.is_hosting == null) p.is_hosting = e.anonymization.is_hosting;
      }
      if (e.shodan  && !p.shodan)      p.shodan      = e.shodan;
      if (e.whois   && !p.whois_data)  p.whois_data  = e.whois;
    }
    // Map credentials_attempted → top_usernames / top_passwords + keep raw for table
    if (Array.isArray(p.credentials_attempted)) {
      if (!p.top_usernames) p.top_usernames = [...new Set(p.credentials_attempted.map(c=>c.username))].slice(0,10);
      if (!p.top_passwords) p.top_passwords = [...new Set(p.credentials_attempted.map(c=>c.password))].slice(0,10);
    }
    // Map commands_executed → top_commands
    if (Array.isArray(p.commands_executed) && !p.top_commands) p.top_commands = p.commands_executed;
    // Map malware block
    if (p.malware && p.malware.yara_match) {
      if (!Array.isArray(p.yara_matches) || !p.yara_matches.length) p.yara_matches = [p.malware.yara_match];
      if (!p.vt_detections) p.vt_detections = p.malware.vt_detections;
      if (!p.vt_family)     p.vt_family     = p.malware.vt_family;
      if (!p.malware_sha256) p.malware_sha256 = p.malware.sha256;
    }
    // Modus operandi
    if (!p.modus_operandi) {
      const mo = {};
      if (p.primary_objective)   mo.primary_objective   = String(p.primary_objective).replaceAll('_',' ');
      if (p.secondary_objective) mo.secondary_objective = String(p.secondary_objective).replaceAll('_',' ');
      if (p.dominant_tactic)     mo.dominant_tactic     = p.dominant_tactic;
      if (p.escalation_detected) mo.escalation          = 'detected';
      if (Array.isArray(p.mitre_techniques) && p.mitre_techniques.length) mo.techniques_count = p.mitre_techniques.length;
      if (Object.keys(mo).length) p.modus_operandi = mo;
    }
    if (!p.actor_type) p.actor_type = p.dominant_tactic || p.primary_objective;
    if (!p.recommended_action) {
      const s = Number(p.risk_score) || 0;
      if (s >= 70)      p.recommended_action = 'Block IP immediately · escalate to SOC team · preserve evidence (chain of custody).';
      else if (s >= 40) p.recommended_action = 'Enhanced monitoring · correlate with other sessions · consider blocking if repeat offender.';
      else if (s >= 20) p.recommended_action = 'Retain logs · monitor patterns · no immediate action required.';
      else              p.recommended_action = 'Background noise · archive for statistical analysis.';
    }
    return p;
  }

  /* ──────────────────────────────────────────────────
     Section renderers — each returns an HTML string
  ────────────────────────────────────────────────── */

  function scoreGauge(score, sev) {
    const r = 36, circ = 2 * Math.PI * r;
    const arc = circ * Math.min(score / 100, 1);
    const col = { CRITICAL:'var(--red2)', HIGH:'var(--accent-gold)', MEDIUM:'var(--blue2)', LOW:'var(--text3)' }[sev] || 'var(--text3)';
    return `
      <div class="dos-gauge">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="7"/>
          <circle cx="45" cy="45" r="${r}" fill="none" stroke="${col}" stroke-width="7"
            stroke-linecap="round"
            stroke-dasharray="${arc.toFixed(2)} ${(circ-arc).toFixed(2)}"
            transform="rotate(-90 45 45)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;top:0;left:0;width:90px;height:90px">
          <div style="font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:800;color:${col};line-height:1">${score}</div>
          <div style="font-size:8px;font-family:'Share Tech Mono',monospace;color:${col};letter-spacing:1px;text-transform:uppercase">${sev}</div>
        </div>
      </div>`;
  }

  function dosHeader(p, sev, score) {
    const soph = SOPH_MAP[p.sophistication] || null;
    const confidencePct = p.confidence != null ? Math.round(Number(p.confidence) * 100) : null;
    const ts = p.last_seen || p.first_seen;
    const dossierNum = STATE.activeId != null ? `#${STATE.activeId}` : '';
    const sevColor = { CRITICAL:'var(--red2)', HIGH:'var(--accent-gold)', MEDIUM:'var(--blue2)', LOW:'var(--text3)' }[sev] || 'var(--text3)';
    const sevBg    = { CRITICAL:'rgba(201,61,85,.06)', HIGH:'rgba(212,168,74,.05)', MEDIUM:'rgba(106,176,255,.05)', LOW:'rgba(154,160,180,.03)' }[sev];

    const geoParts = [];
    if (p.country) geoParts.push(flag(p.country) + ' ' + esc(p.country_name || p.country));
    if (p.city)    geoParts.push(esc(p.city));
    if (p.asn)     geoParts.push('AS' + esc(String(p.asn)));
    if (p.as_org)  geoParts.push(esc(p.as_org));

    const disguiseHtml = p.disguise_used
      ? `<span class="dos-disguise">⬤ DISGUISED · ${esc(String(p.disguise_type||'anonymous').toUpperCase())}</span>`
      : `<span style="font-size:10px;color:var(--text3);font-family:'Share Tech Mono',monospace;padding:4px 10px;border:1px solid var(--border);border-radius:4px">No Anonymization</span>`;

    const stats = [];
    if (p.event_count)   stats.push(['Events',    fmt.num(p.event_count)]);
    if (p.session_count) stats.push(['Sessions',  fmt.num(p.session_count)]);
    if (confidencePct != null) stats.push(['Confidence', confidencePct + '%']);
    if (p.recidivism && p.recidivism.seen_before) stats.push(['Recidivism', '×' + (p.recidivism.previous_sessions ?? '?')]);
    if (p.first_seen)    stats.push(['First Seen', fmt.ago(p.first_seen) + ' ago']);
    if (p.last_seen)     stats.push(['Last Seen',  fmt.ago(p.last_seen)  + ' ago']);

    const statsHtml = stats.length ? `
      <div class="dos-stats-row">
        ${stats.map(([l,v])=>`<div class="dos-stat">
          <div class="dos-stat-label">${l}</div>
          <div class="dos-stat-val">${v}</div>
        </div>`).join('')}
      </div>` : '';

    const orgBar = p.organised_score != null ? (() => {
      const pct = Math.max(0, Math.min(1, Number(p.organised_score) || 0)) * 100;
      return `<div style="margin-top:12px">
        <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px">Organized ← Spectrum → Disorganized</div>
        <div class="dos-org-track"><div class="dos-org-fill" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="dos-org-labels"><span>Disorganized</span><span style="color:var(--text2)">${pct.toFixed(0)}%</span><span>Organized</span></div>
      </div>`;
    })() : '';

    return `
      <div class="dos-card" style="border-top:3px solid ${sevColor};background:${sevBg}">
        <div class="dos-header">
          <div class="dos-hdr-top">
            <div class="dos-hdr-main">
              <div class="dos-ip">${esc(p.source_ip || p.ip || '—')}</div>
              <div class="dos-subtitle">Dossier ${esc(dossierNum)}${ts ? ' · Last activity ' + esc(fmt.ago(ts)) + ' ago' : ''}
                ${geoParts.length ? ' · ' + geoParts.join(' · ') : ''}
              </div>
              <div class="dos-badges">
                ${soph ? `<span class="dos-soph-badge ${soph.cls}">${soph.text}</span>` : '<span class="dos-soph-badge soph-null">UNKNOWN</span>'}
                ${disguiseHtml}
                ${p.escalation_detected ? `<span class="dos-escalation">⚡ ESCALATION DETECTED</span>` : ''}
              </div>
            </div>
            <div style="position:relative;flex-shrink:0">${scoreGauge(score, sev)}</div>
          </div>
          ${statsHtml}
          ${orgBar}
          ${Array.isArray(p.honeypots) && p.honeypots.length ? `
            <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">
              ${p.honeypots.map(hp=>{
                const col={cowrie:'var(--gold)',dionaea:'var(--red2)',galah:'var(--purple2)',zeek:'var(--blue2)'}[hp]||'var(--text3)';
                return `<span style="padding:3px 9px;border-radius:4px;font-size:9px;font-family:'Share Tech Mono',monospace;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:${col};border:1px solid;border-color:${col}55;background:${col}11">${esc(hp)}</span>`;
              }).join('')}
            </div>` : ''}
        </div>
      </div>`;
  }

  function dosNarrative(p) {
    const text = p.detective_narrative || p.mistral_analysis;
    if (!text) return '';
    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">🕵</span>
            <span class="dos-sec-title">Behavioral Assessment</span>
            <span class="dos-sec-sub">Detective Narrative · LLM Analysis</span>
          </div>
          <div class="dos-narrative-box">${esc(text)}</div>
        </div>
      </div>`;
  }

  function dosBehavioral(p, sev) {
    const traits   = p.behavioral_traits || [];
    const sigs     = p.signature_behaviors || p.signature_indicators || [];
    const showOrg  = p.organised_score != null;
    const hasData  = p.primary_objective || traits.length || sigs.length || p.kill_chain_stage;
    if (!hasData) return '';

    const primary   = p.primary_objective   ? String(p.primary_objective).replaceAll('_',' ')   : null;
    const secondary = p.secondary_objective ? String(p.secondary_objective).replaceAll('_',' ') : null;
    const OBJ_ICONS = {
      'botnet recruitment':'🤖','credential harvesting':'🔑','credential access':'🔑',
      'reconnaissance':'🔭','data exfiltration':'📤','cryptomining':'⛏',
      'lateral movement':'↔','persistence':'⚓','opportunistic access':'🎲',
    };
    const objIcon = primary ? (OBJ_ICONS[primary.toLowerCase()] || '🎯') : '🎯';

    // Kill Chain
    const current = p.kill_chain_stage;
    let currentIdx = KC_STEPS.findIndex(s => s.key === current);
    if (currentIdx < 0 && current) currentIdx = KC_STEPS.length - 1;
    const kcHtml = `
      <div style="margin-bottom:14px">
        <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Kill Chain Progression</div>
        <div class="dos-kc-bar">
          ${KC_STEPS.map((s,i) => {
            const done = currentIdx >= 0 && i <= currentIdx;
            const cur  = i === currentIdx;
            return `<div class="dos-kc-step ${done?'done sev-'+sev:''} ${cur?'current':''}" title="${s.key.replaceAll('_',' ')}">${s.label}</div>`;
          }).join('')}
        </div>
        ${currentIdx >= 0 ? `<div class="dos-kc-label">Current stage: <b>${esc(KC_STEPS[currentIdx].label)}</b> — ${esc(KC_STEPS[currentIdx].key.replaceAll('_',' '))}</div>` : ''}
      </div>`;

    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">◈</span>
            <span class="dos-sec-title">Behavioral Profile</span>
            <span class="dos-sec-sub">Modus Operandi · Signature Behavior</span>
          </div>
          ${primary ? `<div style="margin-bottom:8px"><div class="dos-obj-primary">${objIcon} ${esc(primary)}</div></div>` : ''}
          ${secondary ? `<div style="margin-bottom:12px"><div class="dos-obj-secondary">↳ Secondary: ${esc(secondary)}</div></div>` : ''}
          ${traits.length ? `
            <div style="margin-bottom:14px">
              <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">Behavioral Traits</div>
              ${traits.map(t=>`<span class="dos-trait-chip">${esc(String(t))}</span>`).join('')}
            </div>` : ''}
          ${current ? kcHtml : ''}
          ${sigs.length ? `
            <div>
              <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Signature Indicators — Unique behavioral fingerprints</div>
              ${sigs.map(s=>`<div class="dos-sig-item">◆ ${esc(String(s))}</div>`).join('')}
            </div>` : ''}
        </div>
      </div>`;
  }

  function dosMitre(p, sev) {
    const techniques = p.mitre_techniques;
    if (!Array.isArray(techniques) || !techniques.length) return '';

    // Detect if objects [{id,name,tactic}] or strings
    const isObjects = typeof techniques[0] === 'object';

    let contentHtml;
    if (isObjects) {
      // Group by tactic
      const groups = {};
      techniques.forEach(t => {
        const tactic = t.tactic || 'Other';
        if (!groups[tactic]) groups[tactic] = [];
        groups[tactic].push(t);
      });
      contentHtml = `<div class="dos-mitre-groups">
        ${Object.entries(groups).map(([tactic, techs]) => {
          const style = TACTIC_COLORS[tactic] || { bg:'rgba(255,255,255,.04)', color:'var(--text2)', border:'var(--border)' };
          return `<div class="dos-mitre-group" style="border-color:${style.border}">
            <div class="dos-mitre-group-hdr" style="background:${style.bg};color:${style.color}">${esc(tactic)}</div>
            <div class="dos-mitre-group-items">
              ${techs.map(t=>`<span class="dos-mitre-chip" style="color:${style.color};background:${style.bg};border-color:${style.border}">
                <span class="dos-mitre-chip-id">${esc(t.id)}</span>${esc(t.name)}
              </span>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    } else {
      contentHtml = `<div style="display:flex;flex-wrap:wrap;gap:6px">
        ${techniques.map(t=>`<span class="dos-mitre-string">${esc(String(t))}</span>`).join('')}
      </div>`;
    }

    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">⊞</span>
            <span class="dos-sec-title">Modus Operandi — MITRE ATT&CK</span>
            <span class="dos-sec-sub">${techniques.length} technique${techniques.length > 1 ? 's' : ''} identified</span>
          </div>
          ${contentHtml}
        </div>
      </div>`;
  }

  function dosOsint(p) {
    const hasGeo    = p.country || p.city || p.as_org;
    const hasAbuse  = p.abuseipdb_score != null;
    const hasAnon   = p.is_tor != null || p.is_vpn != null;
    const hasShodan = p.shodan && (p.shodan.ports || p.shodan.vulns);
    const hasWhois  = p.whois_data;
    if (!hasGeo && !hasAbuse && !hasAnon && !hasShodan) return '';

    const abuseColor = (s) => s >= 75 ? 'var(--red2)' : s >= 40 ? 'var(--accent-gold)' : s > 0 ? 'var(--blue2)' : 'var(--text3)';

    const geoBlock = `
      <div class="dos-osint-block">
        <div class="dos-osint-block-title">Geographic Profile</div>
        ${p.country ? `<div class="dos-kv"><span class="dos-kv-k">Country</span><span class="dos-kv-v">${flag(p.country)} ${esc(p.country_name||p.country)} (${esc(p.country)})</span></div>` : ''}
        ${p.city ? `<div class="dos-kv"><span class="dos-kv-k">City</span><span class="dos-kv-v">${esc(p.city)}</span></div>` : ''}
        ${p.timezone ? `<div class="dos-kv"><span class="dos-kv-k">Timezone</span><span class="dos-kv-v">${esc(p.timezone)}</span></div>` : ''}
        ${p.asn ? `<div class="dos-kv"><span class="dos-kv-k">ASN</span><span class="dos-kv-v" style="font-family:'JetBrains Mono',monospace">AS${esc(String(p.asn))}</span></div>` : ''}
        ${p.as_org ? `<div class="dos-kv"><span class="dos-kv-k">Organization</span><span class="dos-kv-v">${esc(p.as_org)}</span></div>` : ''}
        ${hasWhois && p.whois_data.cidr ? `<div class="dos-kv"><span class="dos-kv-k">CIDR</span><span class="dos-kv-v" style="font-family:'JetBrains Mono',monospace">${esc(p.whois_data.cidr)}</span></div>` : ''}
      </div>`;

    const abuseBlock = hasAbuse ? `
      <div class="dos-osint-block">
        <div class="dos-osint-block-title">Reputation Intelligence</div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <div style="font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:800;color:${abuseColor(p.abuseipdb_score)};line-height:1">${p.abuseipdb_score}</div>
          <div style="flex:1">
            <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;margin-bottom:4px">AbuseIPDB CONFIDENCE</div>
            <div class="dos-abuse-bar"><div class="dos-abuse-fill" style="width:${Math.min(p.abuseipdb_score,100)}%;background:${abuseColor(p.abuseipdb_score)}"></div></div>
          </div>
        </div>
        ${p.abuse_reports != null ? `<div class="dos-kv"><span class="dos-kv-k">Reports</span><span class="dos-kv-v">${fmt.num(p.abuse_reports)} total reports</span></div>` : ''}
        ${Array.isArray(p.abuse_categories) && p.abuse_categories.length ? `
          <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">
            ${p.abuse_categories.map(c=>`<span style="padding:2px 7px;border-radius:3px;font-size:9px;font-family:'Share Tech Mono',monospace;background:rgba(201,61,85,.08);color:var(--red2);border:1px solid rgba(201,61,85,.25)">${esc(c)}</span>`).join('')}
          </div>` : ''}
      </div>` : '';

    const anonBlock = hasAnon ? `
      <div class="dos-osint-block">
        <div class="dos-osint-block-title">Disguise Detection — Anonymization</div>
        ${[
          ['🧅','Tor Exit Node', p.is_tor],
          ['🛡','VPN',           p.is_vpn],
          ['⚡','Proxy',         p.is_proxy],
          ['🏢','Hosting / DC',  p.is_hosting],
        ].map(([icon,label,val])=>`
          <div class="dos-anon-row">
            <span class="dos-anon-icon">${icon}</span>
            <span class="dos-anon-label">${label}</span>
            <span class="dos-anon-val ${val?'dos-anon-yes':'dos-anon-no'}">${val?'YES':'NO'}</span>
          </div>`).join('')}
      </div>` : '';

    const shodanBlock = hasShodan ? (() => {
      const sh = p.shodan;
      const ports = Array.isArray(sh.ports) && sh.ports.length ? sh.ports : null;
      const vulns = Array.isArray(sh.vulns) && sh.vulns.length ? sh.vulns : null;
      return `
        <div class="dos-osint-block">
          <div class="dos-osint-block-title">Infrastructure — Shodan</div>
          ${ports ? `<div class="dos-kv"><span class="dos-kv-k">Open Ports</span><span class="dos-kv-v" style="font-family:'JetBrains Mono',monospace">${ports.join(', ')}</span></div>` : ''}
          ${vulns ? `<div style="margin-top:8px">
            <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.7px">Known CVEs</div>
            ${vulns.map(v=>`<span class="dos-vuln-tag">${esc(v)}</span>`).join('')}
          </div>` : '<div class="dos-no-data">No known CVEs</div>'}
          ${Array.isArray(sh.tags) && sh.tags.length ? `<div style="margin-top:6px;font-size:10px;color:var(--text3);font-family:'Share Tech Mono',monospace">${sh.tags.map(t=>'['+esc(t)+']').join(' ')}</div>` : ''}
        </div>`; })() : '';

    const blocks = [geoBlock, abuseBlock, anonBlock, shodanBlock].filter(Boolean);
    const gridStyle = blocks.length === 1 ? 'grid-template-columns:1fr' : 'grid-template-columns:1fr 1fr';

    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">🌐</span>
            <span class="dos-sec-title">OSINT Intelligence</span>
            <span class="dos-sec-sub">Geographic Profile · Reputation · Infrastructure</span>
          </div>
          <div class="dos-osint-grid" style="${gridStyle}">${blocks.join('')}</div>
        </div>
      </div>`;
  }

  function dosEvidence(p, sev) {
    const creds    = p.credentials_attempted;
    const cmds     = p.top_commands;
    const hasYara  = Array.isArray(p.yara_matches) && p.yara_matches.length;
    const hasCreds = (Array.isArray(creds) && creds.length) || (Array.isArray(p.top_usernames) && p.top_usernames.length);
    const hasCmds  = Array.isArray(cmds) && cmds.length;
    if (!hasCreds && !hasCmds && !hasYara) return '';

    const credsHtml = (() => {
      if (Array.isArray(creds) && creds.length) {
        return `<table class="dos-cred-tbl" style="margin-bottom:4px">
          <thead><tr><th>#</th><th>Username</th><th>Password</th><th>Result</th></tr></thead>
          <tbody>
            ${creds.map((c,i)=>`<tr class="${c.success?'success':''}">
              <td style="color:var(--text3)">${i+1}</td>
              <td>${esc(c.username)}</td>
              <td>${esc(c.password)}</td>
              <td><span class="dos-cred-success ${c.success?'yes':'no'}">${c.success?'SUCCESS':'FAILED'}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>`;
      }
      if (Array.isArray(p.top_usernames) && p.top_usernames.length) {
        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px">Usernames</div>
            ${p.top_usernames.map(u=>`<span class="dos-trait-chip">${esc(u)}</span>`).join('')}
          </div>
          ${Array.isArray(p.top_passwords) && p.top_passwords.length ? `<div>
            <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px">Passwords</div>
            ${p.top_passwords.map(pw=>`<span class="dos-trait-chip" style="color:var(--red2);border-color:rgba(201,61,85,.25)">${esc(pw)}</span>`).join('')}
          </div>` : ''}
        </div>`;
      }
      return '';
    })();

    const cmdsHtml = hasCmds ? `
      <div style="margin-bottom:4px">
        <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Commands Executed in Session</div>
        ${cmds.map((cmd,i)=>{
          const danger = DANGER_CMDS.test(cmd);
          return `<div class="dos-cmd-line ${danger?'dos-cmd-danger':''}">
            <span class="dos-cmd-n">${i+1}</span>
            <span style="color:var(--text3);margin-right:4px">$</span>
            <span style="${danger?'color:var(--red2)':''}">${esc(cmd)}</span>
          </div>`;
        }).join('')}
      </div>` : '';

    const malwareHtml = (() => {
      if (!hasYara) return `<div class="dos-no-data">No malware captured in this session</div>`;
      const vtStr = p.vt_detections || '';
      let vtNumer = 0, vtDenom = 72;
      if (vtStr.includes('/')) { const [a,b] = vtStr.split('/'); vtNumer = parseInt(a)||0; vtDenom = parseInt(b)||72; }
      const vtPct = vtDenom ? (vtNumer / vtDenom * 100) : 0;
      return `
        <div class="dos-malware-box">
          <div class="dos-malware-family">⚠ ${esc(p.vt_family || p.yara_matches[0])}</div>
          <div style="margin-bottom:6px">
            <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">VirusTotal Detections</div>
            ${vtStr ? `<div style="display:flex;align-items:center;gap:10px">
              <div class="dos-vt-bar" style="flex:1"><div class="dos-vt-fill" style="width:${vtPct.toFixed(1)}%"></div></div>
              <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--red2);flex-shrink:0">${vtStr}</div>
            </div>` : '<div class="dos-no-data">No VT data</div>'}
          </div>
          ${p.yara_matches.map(y=>`<div style="margin-bottom:4px"><span style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px">YARA: </span><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--red2)">${esc(y)}</span></div>`).join('')}
          ${p.malware_sha256 ? `<div class="dos-hash" title="Click to copy SHA-256" onclick="navigator.clipboard.writeText('${esc(p.malware_sha256)}').then(()=>{this.style.color='var(--blue2)';setTimeout(()=>this.style.color='',1200)})">SHA-256 ${fmt.shortHash(p.malware_sha256)}</div>` : ''}
        </div>`;
    })();

    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">🔬</span>
            <span class="dos-sec-title">Forensic Evidence</span>
            <span class="dos-sec-sub">Credentials · Commands · Malware</span>
          </div>
          ${hasCreds ? `
            <div style="margin-bottom:18px">
              <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Attempted Credentials</div>
              ${credsHtml}
            </div>` : ''}
          ${hasCmds ? `<div style="margin-bottom:18px">${cmdsHtml}</div>` : ''}
          <div>
            <div style="font-size:9px;color:var(--text3);font-family:'Share Tech Mono',monospace;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px">Malware Evidence</div>
            ${malwareHtml}
          </div>
        </div>
      </div>`;
  }

  function dosSimilar(p) {
    const count = p.similar_past_cases;
    if (!count && count !== 0) return '';
    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">📂</span>
            <span class="dos-sec-title">Case File Cross-Reference</span>
            <span class="dos-sec-sub">VICAP · Similar behavioral signatures</span>
          </div>
          ${count > 0 ? `
            <div style="padding:12px 16px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;gap:14px">
              <div style="font-family:'Rajdhani',sans-serif;font-size:36px;font-weight:800;color:var(--accent-gold);line-height:1">${count}</div>
              <div>
                <div style="font-size:13px;color:var(--text);font-weight:600;margin-bottom:3px">similar case${count>1?'s':''} in the database</div>
                <div style="font-size:11px;color:var(--text3);font-family:'Share Tech Mono',monospace">Matching behavioral signatures · Run forensic engine to load full matches</div>
              </div>
            </div>` : `<div class="dos-no-data">No similar cases in the database — novel behavioral signature</div>`}
        </div>
      </div>`;
  }

  function dosTimeline(p) {
    const hasData = (p.event_count && p.event_count > 0) || (Array.isArray(p.honeypots) && p.honeypots.length > 1);
    if (!hasData) return '';
    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">⏱</span>
            <span class="dos-sec-title">Cross-Honeypot Timeline</span>
            <span class="dos-sec-sub">Multi-source event correlation</span>
          </div>
          <div style="padding:14px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);text-align:center">
            <div style="font-size:22px;margin-bottom:8px;opacity:.4">◉</div>
            <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Detailed timeline requires forensic engine run</div>
            <div style="font-size:10px;color:var(--text3);font-family:'Share Tech Mono',monospace">
              ${p.first_seen ? 'First event: ' + esc(fmt.date(p.first_seen)) : ''}
              ${p.first_seen && p.last_seen ? ' → ' : ''}
              ${p.last_seen  ? 'Last event: '  + esc(fmt.date(p.last_seen))  : ''}
            </div>
          </div>
        </div>
      </div>`;
  }

  function dosRecommendation(p) {
    if (!p.recommended_action) return '';
    const sevColor = { CRITICAL:'rgba(201,61,85,.1)', HIGH:'rgba(212,168,74,.08)', MEDIUM:'rgba(106,176,255,.08)', LOW:'rgba(154,160,180,.05)' }[p.severity] || '';
    const borColor = { CRITICAL:'rgba(201,61,85,.35)', HIGH:'rgba(212,168,74,.3)', MEDIUM:'rgba(106,176,255,.25)', LOW:'var(--border)' }[p.severity] || 'var(--border)';
    return `
      <div class="dos-card">
        <div class="dos-sec">
          <div class="dos-sec-hdr">
            <span class="dos-sec-icon">⚑</span>
            <span class="dos-sec-title">Recommended Action</span>
          </div>
          <div style="padding:12px 16px;border-radius:6px;background:${sevColor};border:1px solid ${borColor};font-size:13px;color:var(--text)">${esc(p.recommended_action)}</div>
        </div>
      </div>`;
  }

  function dosDump(p) {
    return `
      <div class="dos-card">
        <div class="dos-sec" style="padding-top:12px;padding-bottom:12px">
          <details>
            <summary style="cursor:pointer;font-size:10px;color:var(--text3);font-family:'Share Tech Mono',monospace;user-select:none;padding:4px 0">▶ Raw JSON dossier</summary>
            <pre class="pre" style="max-height:280px;overflow:auto;margin-top:10px;font-size:10px">${esc(JSON.stringify(p, null, 2))}</pre>
          </details>
        </div>
      </div>`;
  }

  function renderDetail(p) {
    const sev   = p.severity || 'LOW';
    const score = Number(p.risk_score) || 0;
    const mockBanner = STATE.useMock
      ? `<div class="dos-mock-banner">ℹ DEMO DATA — not connected to live backend · click "Demo Data" in the top bar to toggle</div>`
      : '';
    $('#p-detail').innerHTML = mockBanner + `<div class="dossier">
      ${dosHeader(p, sev, score)}
      ${dosNarrative(p)}
      ${dosBehavioral(p, sev)}
      ${dosMitre(p, sev)}
      ${dosOsint(p)}
      ${dosEvidence(p, sev)}
      ${dosSimilar(p)}
      ${dosTimeline(p)}
      ${dosRecommendation(p)}
      ${dosDump(p)}
    </div>`;
  }

  /* ──────────────────────────────────────────────────
     Left panel — suspect list
  ────────────────────────────────────────────────── */

  function renderList() {
    let filtered = STATE.profiles.filter(p => {
      if (STATE.activeSev  !== 'ALL' && p.severity       !== STATE.activeSev)  return false;
      if (STATE.activeSoph !== 'ALL' && p.sophistication !== STATE.activeSoph) return false;
      if (STATE.search && !(p.source_ip||'').toLowerCase().includes(STATE.search.toLowerCase())) return false;
      return true;
    });

    // Sort
    filtered = [...filtered].sort((a, b) => {
      if (STATE.sortBy === 'risk_score') return (Number(b.risk_score)||0) - (Number(a.risk_score)||0);
      if (STATE.sortBy === 'last_seen')  return new Date(b.last_seen||0) - new Date(a.last_seen||0);
      if (STATE.sortBy === 'sessions')   return (Number(b.session_count||b.sessions_count)||0) - (Number(a.session_count||a.sessions_count)||0);
      return 0;
    });

    $('#p-list-count').textContent = filtered.length + ' / ' + STATE.profiles.length;

    if (!filtered.length) {
      $('#p-list').innerHTML = `<div class="alert info" style="margin:14px">${
        STATE.profiles.length ? 'No profiles match these filters.' : 'No stored profiles — run the forensic profiler, or load demo data.'
      }</div>`;
      return;
    }

    $('#p-list').innerHTML = filtered.map(p => {
      const sev  = p.severity || 'LOW';
      const soph = SOPH_MAP[p.sophistication];
      const ts   = p.last_seen || p.first_seen;
      const sc   = Number(p.session_count || p.sessions_count) || 0;
      return `
        <div class="p-card p-card-bdr-${sev} ${p.id === STATE.activeId ? 'active' : ''}" data-id="${p.id}">
          <div class="p-card-top">
            <div style="min-width:0">
              <div class="p-card-ip">${esc(p.source_ip || p.ip || '—')}</div>
              <div class="p-card-meta">
                <span class="p-sev-tag p-sev-${sev}">${sev}</span>
                ${soph ? `<span class="p-soph-chip ${soph.chip}" style="border-color:currentColor;opacity:.85">${soph.chipText}</span>` : ''}
                ${p.country ? `<span>${flag(p.country)}</span>` : ''}
                ${p.city    ? `<span>${esc(p.city)}</span>` : p.country_name ? `<span>${esc(p.country_name)}</span>` : ''}
              </div>
            </div>
            <div class="p-card-score p-score-${sev}">${Number(p.risk_score)||0}</div>
          </div>
          <div class="p-card-meta" style="margin-top:2px">
            ${ts ? `<span>${esc(fmt.ago(ts))} ago</span>` : ''}
            ${sc ? `<span>${sc} session${sc>1?'s':''}</span>` : ''}
            ${p.actor_type ? `<span style="color:var(--text3)">${esc(String(p.actor_type).replaceAll('_',' '))}</span>` : ''}
          </div>
        </div>`;
    }).join('');

    $('#p-list').querySelectorAll('.p-card').forEach(el => {
      el.addEventListener('click', () => loadDetail(Number(el.dataset.id)));
    });
  }

  /* ──────────────────────────────────────────────────
     Data loading
  ────────────────────────────────────────────────── */

  async function loadStats() {
    try {
      const s = await api.profilingStats();
      STATE.stats = s;
      $('#p-k-total').textContent     = s.total ?? 0;
      $('#p-k-total-d').textContent   = s.total ? 'stored profiles' : 'no profiles yet';
      $('#p-k-crit').textContent      = s.critical ?? 0;
      $('#p-k-high').textContent      = s.high ?? 0;
      $('#p-k-avg').textContent       = s.avg_score ?? 0;
    } catch(e) {
      ['#p-k-total','#p-k-crit','#p-k-high','#p-k-avg'].forEach(s => $(s).textContent = '—');
      $('#p-k-total-d').textContent = 'Backend offline';
    }
  }

  async function loadList() {
    try {
      const data = await api.profilingList({ limit: 200 });
      STATE.profiles = Array.isArray(data) ? data.map(normalize) : [];
      renderList();
    } catch(e) {
      STATE.profiles = [];
      const msg = e.status === 404
        ? 'Profile list unavailable. Use "Profile an IP" above, or load demo data.'
        : esc(e.message);
      $('#p-list').innerHTML = `<div class="alert info" style="margin:14px">${msg}</div>`;
    }
  }

  async function loadMock() {
    if (!window.MOCK_PROFILES) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'assets/mockProfiles.js?v=1';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load mock profiles'));
        document.head.appendChild(s);
      });
    }
    STATE.useMock = true;
    STATE.profiles = window.MOCK_PROFILES.map(normalize);
    // Update KPI from mock data
    const total = STATE.profiles.length;
    const crit  = STATE.profiles.filter(p => p.severity === 'CRITICAL').length;
    const high  = STATE.profiles.filter(p => p.severity === 'HIGH').length;
    const avg   = Math.round(STATE.profiles.reduce((s,p)=>s+(Number(p.risk_score)||0),0)/total);
    $('#p-k-total').textContent   = total;
    $('#p-k-total-d').textContent = 'demo profiles loaded';
    $('#p-k-crit').textContent    = crit;
    $('#p-k-high').textContent    = high;
    $('#p-k-avg').textContent     = avg;
    renderList();
    renderProfileCharts();
    // Show first profile automatically
    if (STATE.profiles.length && STATE.activeId == null) loadDetail(STATE.profiles[0].id);
  }

  async function lookupIp(ip) {
    ip = (ip||'').trim();
    if (!ip) return;
    if (STATE.useMock) {
      const m = STATE.profiles.find(p => p.source_ip === ip || p.ip === ip);
      if (m) { renderDetail(m); return; }
    }
    $('#p-detail').innerHTML = `<div class="card"><div class="alert info">Profiling <span class="mono">${esc(ip)}</span> — consulting intelligence databases…</div></div>`;
    try {
      const rec = await api.profile(ip);
      renderDetail(normalize(rec));
    } catch(e) {
      if (e.status === 500 || e.status === 422) {
        const listItem = STATE.profiles.find(p => p.source_ip === ip || p.ip === ip);
        if (listItem) { renderDetail(listItem); return; }
      }
      const body = e.status === 404
        ? `<div class="alert info"><b>No profile found for ${esc(ip)}.</b><br>Run the forensic engine to generate a dossier, or load demo profiles.</div>`
        : `<div class="alert err">${esc(e.message)}</div>`;
      $('#p-detail').innerHTML = `<div class="card">${body}</div>`;
    }
  }

  async function loadDetail(id) {
    STATE.activeId = id;
    renderList();
    if (STATE.useMock) {
      const m = STATE.profiles.find(p => p.id === id);
      if (m) { renderDetail(m); return; }
    }
    $('#p-detail').innerHTML = `<div class="card"><div class="alert info">Loading dossier…</div></div>`;
    try {
      const rec = await api.profilingById(id);
      renderDetail(normalize(rec));
    } catch(e) {
      if (e.status === 500 || e.status === 422) {
        const listItem = STATE.profiles.find(p => p.id === id);
        if (listItem) { renderDetail(listItem); return; }
      }
      $('#p-detail').innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div></div>`;
    }
  }

  /* ──────────────────────────────────────────────────
     React charts (keep existing)
  ────────────────────────────────────────────────── */

  function renderProfileCharts() {
    const chartEl = document.getElementById('p-charts-root');
    if (!chartEl || !window.React || !window.ReactDOM || !window.Recharts) return;
    if (!STATE.profiles.length) return;
    const R = window.React, RD = window.ReactDOM, RC = window.Recharts;
    const hh = R.createElement;
    const TT = { backgroundColor:'var(--surface)',border:'1px solid var(--border)',borderRadius:'6px',fontFamily:"'Share Tech Mono',monospace",fontSize:'11px',color:'var(--text)' };
    const AT = { fontSize:10,fill:'var(--text3)',fontFamily:"'Share Tech Mono',monospace" };
    const SEV_C  = { CRITICAL:'#C93D55',HIGH:'#D4A84A',MEDIUM:'#6AB0FF',LOW:'#7d8799' };
    const SOPH_C = { low:'#7d8799',intermediate:'#6AB0FF',high:'#D4A84A',apt:'#C93D55' };
    const bySev  = { CRITICAL:0,HIGH:0,MEDIUM:0,LOW:0 };
    STATE.profiles.forEach(p => { const s=(p.severity||'LOW').toUpperCase(); if(s in bySev) bySev[s]++; });
    const sevData = Object.entries(bySev).map(([k,v])=>({name:k.charAt(0)+k.slice(1).toLowerCase(),value:v,color:SEV_C[k]}));
    const sevTotal = STATE.profiles.length||1;
    const bySoph = { low:0,intermediate:0,high:0,apt:0 };
    STATE.profiles.forEach(p=>{const s=p.sophistication||'low';if(s in bySoph)bySoph[s]++;});
    const sophLabels = { low:'Script Kiddie',intermediate:'Intermediate',high:'Professional',apt:'APT / State' };
    const sophData = Object.entries(bySoph).filter(([,v])=>v>0).map(([k,v])=>({name:sophLabels[k]||k,value:v,color:SOPH_C[k]}));
    function Charts() {
      const sevCard = hh('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 18px'}},
        hh('div',{style:{fontFamily:"'Rajdhani',sans-serif",fontSize:14,fontWeight:700,color:'var(--text)',marginBottom:10}},'Severity Distribution'),
        hh('div',{style:{display:'flex',alignItems:'center',gap:16}},
          hh(RC.PieChart,{width:120,height:120},
            hh(RC.Pie,{data:sevData,dataKey:'value',cx:56,cy:56,innerRadius:34,outerRadius:52,paddingAngle:2},
              ...sevData.map((e,i)=>hh(RC.Cell,{key:i,fill:e.color+'cc',stroke:e.color,strokeWidth:1}))),
            hh(RC.Tooltip,{contentStyle:TT})),
          hh('div',{style:{display:'flex',flexDirection:'column',gap:6,flex:1}},
            ...sevData.map((e,i)=>hh('div',{key:i,style:{display:'flex',alignItems:'center',gap:7}},
              hh('span',{style:{width:8,height:8,borderRadius:'50%',background:e.color,flexShrink:0,display:'inline-block'}}),
              hh('span',{style:{fontSize:11,flex:1,color:'var(--text2)'}},e.name),
              hh('span',{style:{fontFamily:"'Share Tech Mono',monospace",fontSize:11,color:'var(--text3)'}},e.value+' ('+((e.value/sevTotal)*100).toFixed(0)+'%)'))))));
      const sophCard = hh('div',{style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'14px 18px'}},
        hh('div',{style:{fontFamily:"'Rajdhani',sans-serif",fontSize:14,fontWeight:700,color:'var(--text)',marginBottom:10}},'Sophistication Level'),
        sophData.length ? hh(RC.ResponsiveContainer,{width:'100%',height:110},
          hh(RC.BarChart,{data:sophData,layout:'vertical',margin:{top:0,right:10,bottom:0,left:0}},
            hh(RC.CartesianGrid,{strokeDasharray:'3 3',stroke:'rgba(255,255,255,0.04)',horizontal:false}),
            hh(RC.XAxis,{type:'number',tick:AT,tickLine:false,axisLine:false,allowDecimals:false}),
            hh(RC.YAxis,{type:'category',dataKey:'name',width:105,tick:{...AT,fill:'var(--text2)'},tickLine:false,axisLine:false}),
            hh(RC.Tooltip,{contentStyle:TT,formatter:v=>[v+' profiles','Count']}),
            hh(RC.Bar,{dataKey:'value',radius:[0,3,3,0],barSize:16},
              ...sophData.map((e,i)=>hh(RC.Cell,{key:i,fill:e.color+'aa'}))))
        ) : hh('div',{style:{color:'var(--text3)',fontSize:11,fontFamily:"'Share Tech Mono',monospace"}},'No sophistication data'));
      return hh('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},sevCard,sophCard);
    }
    if (!window.__profChartRoot) window.__profChartRoot = RD.createRoot(chartEl);
    window.__profChartRoot.render(hh(Charts,null));
    window.__pageCleanup = ()=>{if(window.__profChartRoot){window.__profChartRoot.unmount();window.__profChartRoot=null;}};
  }

  /* ──────────────────────────────────────────────────
     Event handlers
  ────────────────────────────────────────────────── */

  $('#p-refresh').addEventListener('click', () => {
    STATE.useMock = false;
    loadStats();
    loadList().then(() => renderProfileCharts());
  });

  $('#p-load-mock').addEventListener('click', () => {
    loadMock().catch(e => {
      $('#p-detail').innerHTML = `<div class="card"><div class="alert err">Failed to load demo profiles: ${esc(e.message)}</div></div>`;
    });
  });

  $('#p-search').addEventListener('input', e => { STATE.search = e.target.value.trim(); renderList(); });
  $('#p-sort').addEventListener('change', e => { STATE.sortBy = e.target.value; renderList(); });
  $('#p-soph-filter').addEventListener('change', e => { STATE.activeSoph = e.target.value; renderList(); });
  $('#p-lookup-go').addEventListener('click', () => lookupIp($('#p-lookup').value));
  $('#p-lookup').addEventListener('keydown', e => { if (e.key === 'Enter') lookupIp(e.target.value); });
  $$('.p-filter').forEach(btn => btn.addEventListener('click', () => {
    $$('.p-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    STATE.activeSev = btn.dataset.sev;
    renderList();
  }));

  /* ── Init ── */
  await Promise.all([loadStats(), loadList()]);
  renderProfileCharts();
})();
</script>
