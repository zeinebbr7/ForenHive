<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForenHive — SOC Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
</head>
<body>
<div class="grid-bg"></div>
<div class="app-wrap">
  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <span class="sb-brand-hex"></span>
      <span class="sb-brand-name">FORENHIVE</span>
      <span class="sb-brand-badge">v1.0</span>
    </div>
    <div class="sb-role" id="sb-role"><span class="sb-role-dot"></span>—</div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <button class="sb-logout" id="sb-logout"> Sign Out</button>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="burger" id="burger"></button>
        <h1 class="tb-title" id="tb-title">Dashboard</h1>
      </div>
      <div class="tb-right">
        <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
          <span class="ic-moon">☾</span><span class="ic-sun">☀</span>
        </button>
        <div class="tb-live"><span class="tb-live-dot"></span>LIVE · <span id="tb-time">--:--:--</span></div>
        <div class="tb-user">
          <div class="tb-avatar" id="tb-avatar"></div>
          <div>
            <div class="tb-name" id="tb-name">—</div>
            <div class="tb-role" id="tb-role">—</div>
          </div>
        </div>
      </div>
    </header>
    <main id="content" class="page"></main>
  </div>
</div>

<!-- Drawer (réutilisable) -->
<div class="drawer-bd" id="drawer-bd"></div>
<aside class="drawer" id="drawer"></aside>

<!-- Modal (réutilisable) -->
<div class="modal-bd" id="modal-bd"><div class="modal" id="modal"></div></div>

<script src="assets/api.js?v=11"></script>
<script src="assets/app.js?v=12"></script>
<script>
  // Theme — persisted in localStorage, applied before first paint via inline script below is ideal,
  // but we do it right after shell init which is fine (FOUC is minimal here).
  (function themeInit(){
    const saved = localStorage.getItem('fh.theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.addEventListener('click', () => {
      const now = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', now);
      localStorage.setItem('fh.theme', now);
    });
  })();
  initAppShell();
  // Drawer helpers
  window.openDrawer = (html) => { $('#drawer').innerHTML = html; $('#drawer').classList.add('open'); $('#drawer-bd').classList.add('open'); };
  window.closeDrawer = () => { $('#drawer').classList.remove('open'); $('#drawer-bd').classList.remove('open'); };
  $('#drawer-bd').addEventListener('click', closeDrawer);
  // Modal helpers
  window.openModal = (html) => { $('#modal').innerHTML = html; $('#modal-bd').classList.add('open'); };
  window.closeModal = () => { $('#modal-bd').classList.remove('open'); };
  $('#modal-bd').addEventListener('click', e => { if (e.target.id === 'modal-bd') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeDrawer(); closeModal(); } });
</script>
</body>
</html>
