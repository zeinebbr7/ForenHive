<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">💊 Monitoring</div>
    <h2 class="page-title">Health <span>check</span></h2>
    <div class="page-sub">État des services ForenHive · endpoint <span class="mono">/health</span>.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gold btn-sm" id="refresh-now">🔄 Vérifier</button>
  </div>
</div>

<div class="grid-3 mb-20" id="svc-grid"><div class="alert info" style="grid-column:1/-1">Chargement…</div></div>

<div class="grid-2 mb-20">
  <div class="card">
    <div class="card-h"><div class="card-t">Backend FastAPI</div><div class="card-sub" id="api-info">—</div></div>
    <div id="api-detail" class="mono" style="font-size:11px;line-height:1.8"><div class="alert info">Chargement…</div></div>
  </div>
  <div class="card">
    <div class="card-h"><div class="card-t">Audit trail</div><div class="card-sub">10 dernières actions</div></div>
    <div id="audit-list" class="scroll-y" style="max-height:260px"><div class="alert info">Chargement…</div></div>
  </div>
</div>

<script>
(async function(){
  const { fmt, esc, $ } = FH;

  const STLABEL = {up:'OPÉRATIONNEL', ok:'OK', down:'HORS-LIGNE', degraded:'DÉGRADÉ', warn:'DÉGRADÉ'};
  const STCLASS = {up:'teal', ok:'teal', down:'red', degraded:'gold', warn:'gold'};

  async function load() {
    $('#svc-grid').innerHTML = '<div class="alert info" style="grid-column:1/-1">Vérification…</div>';
    try {
      const h = await api.health();
      const components = h.components || h.checks || h.services || {};
      const entries = Object.entries(components);

      if (!entries.length) {
        $('#svc-grid').innerHTML = `<div class="card" style="grid-column:1/-1">
          <div class="flex items-c" style="justify-content:space-between">
            <div class="card-t">Backend ForenHive</div>
            <span class="badge ${STCLASS[h.status] || 'gold'}"><span class="dot ${h.status === 'ok' || h.status === 'up' ? 'up' : 'down'}"></span>${STLABEL[h.status] || esc(h.status || 'UNKNOWN')}</span>
          </div>
        </div>`;
      } else {
        $('#svc-grid').innerHTML = entries.map(([name, st]) => {
          const status = (typeof st === 'string') ? st : (st.status || 'unknown');
          const version = st.version || '';
          const detail = st.detail || st.message || '';
          return `<div class="card">
            <div class="flex items-c" style="justify-content:space-between;margin-bottom:8px">
              <div class="card-t">${esc(name)}</div>
              <span class="badge ${STCLASS[status] || 'gold'}"><span class="dot ${status === 'ok' || status === 'up' ? 'up' : (status === 'down' ? 'down' : 'warn')}"></span>${STLABEL[status] || esc(status.toUpperCase())}</span>
            </div>
            <div class="text-3 mono" style="font-size:11px">${esc(version || detail || '—')}</div>
          </div>`;
        }).join('');
      }

      $('#api-info').textContent = `${api.base} · status : ${h.status || 'unknown'}`;
      $('#api-detail').innerHTML = `<pre class="pre">${esc(JSON.stringify(h, null, 2))}</pre>`;

    } catch (e) {
      $('#svc-grid').innerHTML = `<div class="alert err" style="grid-column:1/-1">Backend injoignable : ${esc(e.message)}</div>`;
      $('#api-info').textContent = 'hors-ligne';
      $('#api-detail').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    }
  }

  async function loadAudit() {
    try {
      const res = await api.audit({ limit: 10 });
      const items = (res && res.items) || [];
      $('#audit-list').innerHTML = items.length ? items.map(a => `
        <div class="log-row">
          <div class="log-t">${fmt.time(a.timestamp)}</div>
          <div class="log-s" style="color:var(--gold)">${esc(a.action)}</div>
          <div class="log-ip">${esc(a.actor_email || '—')}</div>
          <div class="log-m">${esc((a.method || '')+' '+(a.path || ''))}</div>
        </div>`).join('') : '<div class="alert info">Aucune entrée.</div>';
    } catch (e) {
      $('#audit-list').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    }
  }

  $('#refresh-now').addEventListener('click', async () => {
    const btn = $('#refresh-now'); btn.disabled = true; btn.textContent = '⟳ Vérification…';
    await Promise.all([load(), loadAudit()]);
    btn.disabled = false; btn.innerHTML = '🔄 Vérifier';
  });

  await Promise.all([load(), loadAudit()]);
})();
</script>
