services:

  # ── HONEYPOTS ────────────────────────────────────────
  cowrie:
    image: cowrie/cowrie:latest
    container_name: forenhive-cowrie
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2223:2223"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var
      - ./honeypots/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypots/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
    networks:
      - honeypot-net
    environment:
      - COWRIE_TELNET_ENABLED=yes

  dionaea:
    image: dinotools/dionaea:latest
    container_name: forenhive-dionaea
    restart: unless-stopped
    ports:
      - "23:23"
      - "80:80"
      - "135:135"
      - "443:443"
      - "445:445"
      - "1433:1433"
      - "1723:1723"
      - "1883:1883"
      - "3306:3306"
      - "11211:11211"
      - "27017:27017"
    volumes:
      - dionaea-logs:/opt/dionaea/var/log
      - dionaea-malware:/opt/dionaea/var/lib/dionaea
      - ./honeypots/dionaea/smb.yaml:/opt/dionaea/template/etc/dionaea/services-enabled/smb.yaml:ro
      - ./honeypots/dionaea/mssql.yaml:/opt/dionaea/template/etc/dionaea/services-enabled/mssql.yaml:ro
    environment:
      - DIONAEA_FORCE_INIT_DATA=1
    networks:
      - honeypot-net

  galah:
    build: ./honeypots/galah/galah-src
    container_name: forenhive-galah
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8888:8888"
    networks:
      - honeypot-net
      - backend-net
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=mistral
      - LLM_SERVER_URL=http://forenhive-ollama:11434
    volumes:
      - galah-logs:/app
    depends_on:
      - ollama

  zeek:
    image: zeek/zeek:latest
    container_name: forenhive-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - zeek-logs:/usr/local/zeek/logs
      - ./honeypots/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
    command: >
      sh -c "sed -i 's/interface=eth0/interface=eno12399/g'
      /usr/local/zeek/etc/node.cfg &&
      zeekctl deploy &&
      tail -f /dev/null"

  # ── PIPELINE ETL ─────────────────────────────────────
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: forenhive-filebeat
    restart: unless-stopped
    user: root
    volumes:
      - ./pipeline/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - cowrie-var:/var/log/cowrie:ro
      - dionaea-logs:/var/log/dionaea:ro
      - zeek-logs:/var/log/zeek:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - galah-logs:/var/log/galah:ro
    networks:
      - honeypot-net
      - backend-net
    depends_on:
      - logstash

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: forenhive-logstash
    restart: unless-stopped
    volumes:
      - ./pipeline/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./pipeline/logstash/pipelines:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
    networks:
      - backend-net
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    depends_on:
      - elasticsearch

  # ── STOCKAGE ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: forenhive-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - network.host=0.0.0.0
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - backend-net

  postgresql:
    image: postgres:15
    container_name: forenhive-postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-forenhive}
      - POSTGRES_USER=${POSTGRES_USER:-forenhive}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend-net

  # ── LLM ──────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: forenhive-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend-net

# ── RÉSEAUX ──────────────────────────────────────────
networks:
  honeypot-net:
    name: honeypot-net
    driver: bridge
  backend-net:
    name: backend-net
    driver: bridge

# ── VOLUMES ──────────────────────────────────────────
volumes:
  cowrie-var:
    external: true
    name: bb474ddc3d2a3f3026c85d4c2fe7f1c5723f2e68f8ba60a05e4c9bb4471292ce
  dionaea-logs:
    external: true
    name: dionaea_dionaea-logs
  dionaea-malware:
    external: true
    name: dionaea_dionaea-malware
  zeek-logs:
    external: true
    name: zeek_zeek-logs
  elasticsearch-data:
  postgresql-data:
  ollama-models:
    external: true
    name: llm_ollama-models
  galah-logs:
