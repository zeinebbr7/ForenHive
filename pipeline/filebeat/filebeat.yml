filebeat.inputs:

  - type: log
    enabled: true
    paths:
      - /var/log/cowrie/log/cowrie/cowrie.json
    tags: ["cowrie", "honeypot_cowrie"]
    json.keys_under_root: true
    json.add_error_key: true

  - type: log
    enabled: true
    paths:
      - /var/log/dionaea/dionaea/dionaea.log
    tags: ["dionaea", "honeypot_dionaea"]

  - type: log
    enabled: true
    paths:
      - /var/log/zeek/current/conn.log
      - /var/log/zeek/current/ssh.log
      - /var/log/zeek/current/http.log
    tags: ["zeek", "NIDS"]
    json.keys_under_root: true
    json.add_error_key: true

  - type: log
    enabled: true
    paths:
      - /var/log/galah/event_log.json
    tags: ["galah", "honeypot_galah"]
    json.keys_under_root: true
    json.add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
