<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px"> Geo Map</div>
    <h2 class="page-title">Attacker <span>Map</span></h2>
    <div class="page-sub">Real geographic positions · MaxMind GeoIP enrichment.</div>
  </div>
  <div class="page-actions">
    <span id="geo-badge" class="badge blue" style="font-size:12px">Loading…</span>
  </div>
</div>

<div style="position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px">
  <div id="map" style="height:520px;background:#0a0e1a"></div>
  <div id="map-legend" style="
    position:absolute;bottom:24px;right:12px;z-index:1000;
    background:rgba(10,14,26,.9);border:1px solid var(--border);
    border-radius:8px;padding:10px 14px;font-size:11px;
    font-family:'JetBrains Mono',monospace;color:var(--text2);
    pointer-events:none">
    <div style="margin-bottom:6px;font-size:10px;color:var(--text3);letter-spacing:.06em">LEGEND</div>
    <div class="flex items-c gap-8" style="margin-bottom:4px">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(255,80,80,.8)" stroke="#ff5050" stroke-width="1.5"/></svg>
      Dionaea
    </div>
    <div class="flex items-c gap-8" style="margin-bottom:4px">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(140,26,43,.8)" stroke="#8C1A2B" stroke-width="1.5"/></svg>
      Cowrie
    </div>
    <div class="flex items-c gap-8" style="margin-bottom:4px">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(180,100,255,.8)" stroke="#b464ff" stroke-width="1.5"/></svg>
      Galah
    </div>
    <div class="flex items-c gap-8">
      <svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="rgba(80,160,255,.8)" stroke="#50a0ff" stroke-width="1.5"/></svg>
      Zeek NDR
    </div>
  </div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-h"><div class="card-t">Top Countries</div></div>
    <div id="geo-countries"><div class="alert info">Loading…</div></div>
  </div>
  <div class="card">
    <div class="card-h"><div class="card-t">Top Geolocated IPs</div><div class="card-sub" id="geo-sub">click to center map</div></div>
    <div id="geo-ips"><div class="alert info">Loading…</div></div>
  </div>
</div>

<script>
(async function(){
  const { SOURCE_META, fmt, esc, $, $$, flag, evNormalize } = FH;
  const R = window.React, RD = window.ReactDOM, RC = window.Recharts;
  const TOOLTIP_STYLE = { backgroundColor:'#0d111e', border:'1px solid #1e2538', borderRadius:'6px', fontFamily:"'JetBrains Mono',monospace", fontSize:'11px', color:'#e0e6f0' };
  const AXIS_TICK = { fontSize:10, fill:'#8892a4', fontFamily:"'JetBrains Mono',monospace" };
  const HP_COLORS = { dionaea:'#ff5050', cowrie:'#8C1A2B', galah:'#b464ff', zeek:'#50a0ff' };
  let __countryRoot = null, __ipChartRoot = null;

  const map = L.map('map', {
    center: [20, 10], zoom: 2, zoomControl: true, attributionControl: false,
    worldCopyJump: false, maxBounds: [[-90, -200], [90, 200]], maxBoundsViscosity: 0.8,
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18, subdomains: 'abcd' }).addTo(map);
  setTimeout(() => map.invalidateSize(), 100);

  async function fetchGeoEvents() {
    const results = await Promise.allSettled([
      api.attacks({ page_size: 100, page: 1, honeypot: 'cowrie'  }),
      api.attacks({ page_size: 100, page: 1, honeypot: 'dionaea' }),
      api.attacks({ page_size: 100, page: 1, honeypot: 'galah'   }),
    ]);
    const seen = new Set();
    const all = [];
    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      for (const item of (r.value.items || [])) {
        if (!seen.has(item.id)) { seen.add(item.id); all.push(item); }
      }
    }
    return all.map(evNormalize);
  }

  async function fetchPgGeoSessions() {
    try {
      const data = await api._call('/api/geo/forensic-sessions?limit=200');
      return (data && data.sessions) || [];
    } catch (e) { return []; }
  }

  function extractGeo(n) {
    const raw = n.raw || {};
    const sg = raw['source.geo'];
    if (!sg || typeof sg !== 'object') return null;
    const geo = (sg.location ? sg : sg.geo) || sg;
    if (!geo || typeof geo !== 'object') return null;
    const loc = geo.location;
    if (!loc) return null;
    const lat = parseFloat(loc.lat), lon = parseFloat(loc.lon);
    if (isNaN(lat) || isNaN(lon)) return null;
    return { lat, lon, country_code: geo.country_iso_code || '', country_name: geo.country_name || '', city: geo.city_name || geo.region_name || '' };
  }

  function markerColor(hp) {
    const m = { dionaea:{fill:'rgba(255,80,80,.8)',stroke:'#ff5050'}, cowrie:{fill:'rgba(140,26,43,.8)',stroke:'#8C1A2B'}, galah:{fill:'rgba(180,100,255,.8)',stroke:'#b464ff'}, zeek:{fill:'rgba(80,160,255,.8)',stroke:'#50a0ff'} };
    return m[hp] || { fill:'rgba(120,200,120,.8)', stroke:'#78c878' };
  }

  try {
    const [normalized, pgSessions] = await Promise.all([fetchGeoEvents(), fetchPgGeoSessions()]);

    // Build byIP from ES events
    const byIP = {};
    normalized.forEach(n => {
      const geo = extractGeo(n);
      if (!geo) return;
      const ip = n.source_ip || (n.raw && n.raw['source.ip']) || '?';
      if (!byIP[ip]) byIP[ip] = { ip, geo, honeypot: n.honeypot, count: 0 };
      byIP[ip].count++;
    });
    // Merge PG forensic sessions (enriched IPs with real geo) — overrides ES placeholders
    pgSessions.forEach(s => {
      const ip = s.source_ip;
      if (!ip || isNaN(s.lat) || isNaN(s.lon)) return;
      const geo = { lat: s.lat, lon: s.lon, country_code: s.country_code || '', country_name: s.country_name || '', city: s.city || '' };
      if (byIP[ip]) {
        // Keep count but update geo to the enriched one (correct country)
        byIP[ip].geo = geo;
        byIP[ip].risk_score = s.risk_score;
        byIP[ip].risk_level = s.risk_level;
        if (s.honeypot_type && s.honeypot_type !== 'unified') byIP[ip].honeypot = s.honeypot_type;
      } else {
        byIP[ip] = { ip, geo, honeypot: s.honeypot_type || 'cowrie', count: s.sessions || 1, risk_score: s.risk_score, risk_level: s.risk_level, fromPg: true };
      }
    });

    const ipList = Object.values(byIP).sort((a,b) => (b.risk_score||b.count) - (a.risk_score||a.count));
    const totalGeo = ipList.length;
    const pgCount = pgSessions.length;
    $('#geo-badge').textContent = `${totalGeo} geolocated IP${totalGeo>1?'s':''}${pgCount?' ('+pgCount+' enriched)':''}`;

    if (!ipList.length) {
      $('#geo-countries').innerHTML = `<div class="alert info">No geolocated IPs in the last 7 days.<br>Local 172.16.x.x traffic is not processed by GeoIP.</div>`;
      $('#geo-ips').innerHTML = `<div class="alert info">No data.</div>`;
      return;
    }

    const bounds = [];
    const markerMap = {};
    ipList.forEach(d => {
      const clr = markerColor(d.honeypot);
      const r = Math.max(8, Math.min(26, 8 + Math.log2(d.count + 1) * 3));
      bounds.push([d.geo.lat, d.geo.lon]);
      const circle = L.circleMarker([d.geo.lat, d.geo.lon], { radius:r, fillColor:clr.fill, color:clr.stroke, weight:1.5, fillOpacity:0.85 });
      const meta = SOURCE_META[d.honeypot] || { label: d.honeypot || '?', icon: '' };
      const riskColor = d.risk_score >= 70 ? '#C62828' : d.risk_score >= 45 ? '#b36000' : d.risk_score >= 25 ? '#1565C0' : '#388E3C';
      circle.bindPopup(`<div style="font-family:'JetBrains Mono',monospace;font-size:12px;min-width:180px">
        <div style="font-size:14px;font-weight:700;margin-bottom:6px">${flag(d.geo.country_code)} ${esc(d.ip)}</div>
        <div style="color:#aaa;margin-bottom:4px">${esc(d.geo.country_name)}${d.geo.city?' · '+esc(d.geo.city):''}</div>
        <div style="margin-bottom:4px">${meta.icon} ${esc(meta.label)}</div>
        ${d.risk_score != null ? `<div style="color:${riskColor};font-weight:700;">Risk: ${d.risk_score}/100 ${d.risk_level||''}</div>` : `<div style="color:#8C1A2B"><b>${d.count}</b> event${d.count>1?'s':''}</div>`}
      </div>`, { maxWidth: 240 });
      circle.addTo(map);
      markerMap[d.ip] = circle;
    });
    if (bounds.length) { map.fitBounds(bounds, { padding:[60,60], maxZoom:7, minZoom:2 }); if (map.getZoom()<2) map.setZoom(2); }

    const byCountry = {};
    ipList.forEach(d => {
      const k = d.geo.country_code || '??';
      if (!byCountry[k]) byCountry[k] = { code:k, name:d.geo.country_name||k, count:0, ips:0 };
      byCountry[k].count += d.count; byCountry[k].ips++;
    });
    const countries = Object.values(byCountry).sort((a,b) => b.count - a.count);

    // Countries Recharts chart
    const countryBarData = countries.slice(0,12).map(c=>({
      name: flag(c.code)+' '+c.name.slice(0,12),
      count: c.count,
      ips: c.ips,
    }));
    if (R && RD && RC && countryBarData.length) {
      const hh = R.createElement;
      function CountryChart() {
        return hh(RC.ResponsiveContainer,{width:'100%',height:Math.max(180, countryBarData.length*30+20)},
          hh(RC.BarChart,{data:countryBarData,layout:'vertical',margin:{top:0,right:40,bottom:0,left:0}},
            hh(RC.CartesianGrid,{strokeDasharray:'3 3',stroke:'rgba(255,255,255,0.05)',horizontal:false}),
            hh(RC.XAxis,{type:'number',tick:AXIS_TICK,tickLine:false,axisLine:false,allowDecimals:false}),
            hh(RC.YAxis,{type:'category',dataKey:'name',width:160,tick:{...AXIS_TICK,fill:'#e0e6f0'},tickLine:false,axisLine:false}),
            hh(RC.Tooltip,{contentStyle:TOOLTIP_STYLE,formatter:(v,n,p)=>[v+' events ('+p.payload.ips+' IPs)','Events']}),
            hh(RC.Bar,{dataKey:'count',name:'Events',radius:[0,3,3,0],barSize:16,fill:'#8C1A2Bbb',label:{position:'right',style:{fill:'#8892a4',fontSize:10,fontFamily:"'JetBrains Mono',monospace"},formatter:v=>v}})
          )
        );
      }
      if (!__countryRoot) __countryRoot = RD.createRoot($('#geo-countries'));
      __countryRoot.render(hh(CountryChart,null));
    } else {
      $('#geo-countries').innerHTML = countryBarData.length ? '' : '<div class="alert info">No geolocated IPs in the last 7 days.</div>';
    }

    // Keep table for click-to-fly, but prepend a mini chart
    const ipBarData = ipList.slice(0,8).map(d=>({
      ip: flag(d.geo.country_code)+' '+d.ip,
      count: d.count,
      color: HP_COLORS[d.honeypot]||'#888',
      rawIp: d.ip,
    }));

    let ipsHTML = '';
    if (R && RD && RC && ipBarData.length) {
      ipsHTML = '<div id="geo-ip-chart-root" style="margin-bottom:12px"></div>';
    }
    ipsHTML += `<table class="tbl"><thead><tr><th>IP</th><th>Location</th><th>Events</th></tr></thead>
      <tbody>${ipList.slice(0,15).map(d=>`
        <tr class="geo-ip-row" data-ip="${esc(d.ip)}" style="cursor:pointer">
          <td class="mono" style="font-size:11px">${esc(d.ip)}</td>
          <td style="font-size:11px">${flag(d.geo.country_code)} ${esc(d.geo.country_name)}${d.geo.city?' · '+esc(d.geo.city):''}</td>
          <td><span class="badge ${d.honeypot==='zeek'?'blue':d.honeypot==='dionaea'?'red':'gold'}">${d.count}</span></td>
        </tr>`).join('')}</tbody></table>`;
    $('#geo-ips').innerHTML = ipsHTML;

    // Re-attach click handlers
    $$('.geo-ip-row').forEach(row => {
      row.addEventListener('click', () => {
        const marker = markerMap[row.dataset.ip]; if (!marker) return;
        const ll = marker.getLatLng();
        map.flyTo([ll.lat, ll.lng], 6, { duration: 1 });
        setTimeout(() => marker.openPopup(), 1100);
      });
    });

    // Render IP bar chart
    const ipChartEl = document.getElementById('geo-ip-chart-root');
    if (ipChartEl && R && RD && RC && ipBarData.length) {
      const hh = R.createElement;
      function IpChart() {
        return hh(RC.ResponsiveContainer,{width:'100%',height:Math.max(120, ipBarData.length*24+20)},
          hh(RC.BarChart,{data:ipBarData,layout:'vertical',margin:{top:0,right:20,bottom:0,left:0}},
            hh(RC.CartesianGrid,{strokeDasharray:'3 3',stroke:'rgba(255,255,255,0.05)',horizontal:false}),
            hh(RC.XAxis,{type:'number',tick:AXIS_TICK,tickLine:false,axisLine:false,allowDecimals:false}),
            hh(RC.YAxis,{type:'category',dataKey:'ip',width:155,tick:{...AXIS_TICK,fill:'#e0e6f0'},tickLine:false,axisLine:false}),
            hh(RC.Tooltip,{contentStyle:TOOLTIP_STYLE,formatter:v=>[v+' events','Count']}),
            hh(RC.Bar,{dataKey:'count',name:'Events',radius:[0,3,3,0],barSize:12},
              ...ipBarData.map((e,i)=>hh(RC.Cell,{key:i,fill:e.color+'bb'}))
            )
          )
        );
      }
      if (!__ipChartRoot) __ipChartRoot = RD.createRoot(ipChartEl);
      __ipChartRoot.render(hh(IpChart,null));
    }

    window.__pageCleanup = () => {
      if (__countryRoot) { __countryRoot.unmount(); __countryRoot = null; }
      if (__ipChartRoot) { __ipChartRoot.unmount(); __ipChartRoot = null; }
    };
  } catch (e) {
    console.error('GeoMap error:', e);
    $('#geo-badge').textContent = 'Error';
    $('#geo-countries').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    $('#geo-ips').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
  }
})();
</script>
