  {"Headers":{"Content-Type":"text/html; charset=utf-8","Server":"Apache/2.4.29 (Ubuntu)","X-Powered-By":"PHP/7.2.24","Set-Cookie":"phpMyAdmin=7f3a9c2e1b4d8f05; path=/; HttpOnly"},"Body":"<!DOCTYPE html><html><head><title>phpMyAdmin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f0f0f0;display:flex;justify-content:center;align-items:center;min-height:100vh}.wrap{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.15);padding:30px;width:380px}.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}.logo-icon{font-size:28px}.logo-text{font-size:20px;font-weight:700;color:#f89406}input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:3px;font-size:14px}button{width:100%;padding:10px;background:#4e73df;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:15px;margin-top:10px}.version{font-size:11px;color:#aaa;text-align:center;margin-top:16px}</style></head><body><div class='wrap'><div class='logo'><span class='logo-icon'>&#128033;</span><span class='logo-text'>phpMyAdmin</span></div><form method='POST' action='index.php'><label style='font-size:13px;color:#555'>Username</label><input type='text' name='pma_username' placeholder='root'><label style='font-size:13px;color:#555'>Password</label><input type='password' name='pma_password'><select name='server'><option value='1'>MySQL (127.0.0.1:3306)</option></select><button type='submit'>Log In</button></form><div class='version'>phpMyAdmin 4.8.5 &mdash; MySQL 5.7.39-Ubuntu</div></div></body></html>"}

