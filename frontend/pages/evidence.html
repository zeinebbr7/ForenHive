<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">Forensic Analysis</div>
    <h2 class="page-title">Evidence <span>Logs</span></h2>
    <div class="page-sub">Raw honeypot logs · filter by sensor · SHA-256 verification per entry.</div>
  </div>
  <div class="page-actions" style="gap:10px;align-items:center">
    <span id="ev-run-status" style="font-size:12px;color:var(--text3)"></span>
    <button class="btn btn-primary btn-sm" id="ev-run-btn"> Run Analysis Now</button>
    <button class="btn btn-gh btn-sm" id="ev-refresh">Refresh</button>
  </div>
</div>

<div class="card mb-16">
  <div class="card-h">
    <div class="card-t">Filters</div>
  </div>
  <div class="grid-2">
    <div class="form-g">
      <label class="form-l">Source</label>
      <select class="form-s" id="ev-hp">
        <option value="">All honeypots (Cowrie + Dionaea + Galah)</option>
        <option value="cowrie">Cowrie only</option>
        <option value="dionaea">Dionaea only</option>
        <option value="galah">Galah only</option>
        <option value="zeek">Zeek (NDR) — cross-honeypot correlation</option>
      </select>
      <div class="card-sub" style="font-size:10px;margin-top:4px">Zeek (passive NDR) logs are large and excluded by default · explicitly select Zeek to view them.</div>
    </div>
    <div class="form-g">
      <label class="form-l">Limit (max)</label>
      <select class="form-s" id="ev-limit">
        <option value="50">50</option>
        <option value="100" selected>100</option>
        <option value="200">200</option>
        <option value="500">500</option>
      </select>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-h">
    <div class="card-t">Raw Logs</div>
    <div class="card-sub"><span id="ev-count">0</span> entries · <span id="ev-sealed">0</span> SHA-256 sealed</div>
  </div>
  <div id="ev-rows"><div class="alert info">Loading…</div></div>
</div>

<div id="ev-drawer" class="ev-drawer">
  <div class="ev-drawer-head">
    <div style="min-width:0">
      <div class="ev-drawer-title">Log Detail</div>
      <div class="ev-drawer-sid" id="ev-drawer-sid">—</div>
    </div>
    <button class="ev-drawer-close" id="ev-drawer-close" title="Close (Esc)">✕</button>
  </div>
  <div class="ev-drawer-body" id="ev-drawer-body"></div>
</div>
<div id="ev-backdrop" class="ev-backdrop"></div>

<style>
.ev-drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: 400px; max-width: 100vw;
  background: var(--bg2); border-left: 1px solid var(--border2); z-index: 100;
  transform: translateX(100%); transition: transform .26s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column; box-shadow: -6px 0 28px rgba(0,0,0,.45);
}
.ev-drawer.open { transform: translateX(0); }
.ev-backdrop {
  position: fixed; inset: 0; z-index: 99;
  background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .22s;
}
.ev-backdrop.show { opacity: 1; pointer-events: auto; }
.ev-drawer-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 16px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.ev-drawer-title { font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: .4px; }
.ev-drawer-sid { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-drawer-close { background: none; border: none; color: var(--text3); font-size: 16px; cursor: pointer; padding: 2px 4px; line-height: 1; border-radius: 4px; flex-shrink: 0; transition: color .15s, background .15s; }
.ev-drawer-close:hover { color: var(--text); background: var(--surface2); }
.ev-drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.ev-d-hero { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.ev-d-ip { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: var(--text1); }
.ev-d-section { font-size: 9px; font-family: 'Share Tech Mono', monospace; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.ev-d-row { display: grid; grid-template-columns: 100px 1fr; gap: 4px 10px; padding: 4px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.03); }
.ev-d-row:last-child { border-bottom: none; }
.ev-d-k { color: var(--text3); font-family: 'Share Tech Mono', monospace; font-size: 11px; }
.ev-d-v { color: var(--text1); word-break: break-all; }
.ev-d-cmd { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gold); background: rgba(140,26,43,.08); border-left: 2px solid var(--gold); padding: 6px 10px; border-radius: 0 4px 4px 0; margin: 6px 0; white-space: pre-wrap; word-break: break-all; }
.ev-d-cred { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--red2); background: rgba(201,61,85,.07); border-left: 2px solid var(--red2); padding: 6px 10px; border-radius: 0 4px 4px 0; margin: 6px 0; }
.ev-d-hash { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--accent-gold); background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; margin: 6px 0; word-break: break-all; line-height: 1.5; }
.ev-d-raw-toggle { background: none; border: 1px solid var(--border); color: var(--text3); font-size: 11px; font-family: 'Share Tech Mono', monospace; padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-top: 12px; transition: color .15s, border-color .15s; }
.ev-d-raw-toggle:hover { color: var(--text2); border-color: var(--border2); }
.ev-d-raw { display: none; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-top: 6px; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text3); white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; }
.ev-d-raw.show { display: block; }
.evlog { border-bottom: 1px solid var(--border); padding: 9px 0; cursor: pointer; transition: background .12s; border-radius: 4px; margin: 0 -8px; padding-left: 8px; padding-right: 8px; }
.evlog:hover { background: rgba(255,255,255,.025); }
.evlog.active { background: rgba(140,26,43,.08); border-left: 2px solid var(--gold); padding-left: 6px; }
.evlog:last-child { border-bottom: none; }
.evlog-h { display:grid; grid-template-columns: 90px 80px 1fr auto; gap:10px; align-items:center; }
.evlog-time { font-family:'Share Tech Mono',monospace; font-size:11px; color: var(--text3); }
.evlog-msg { font-size: 12.5px; color: var(--text2); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.evlog-hash { font-family:'Share Tech Mono',monospace; font-size:10px; color: var(--gold); }
</style>

<script>
(async function(){
  const { fmt, esc, $ } = FH;
  const { evNormalize } = FH;

  let allItems = [];
  let activeIdx = null;

  const drawerEl  = document.getElementById('ev-drawer');
  const backdropEl = document.getElementById('ev-backdrop');
  document.body.appendChild(drawerEl);
  document.body.appendChild(backdropEl);

  function openDrawer(idx) {
    try {
      activeIdx = idx;
      document.querySelectorAll('.evlog').forEach((el, i) => el.classList.toggle('active', i === idx));
      const ev = allItems[idx];
      if (!ev) return;
      const n  = evNormalize(ev);
      const raw = n.raw || {};
      const hash = ev.sha256 || raw.sha256 || '';
      const hpColor = n.honeypot==='cowrie'?'gold':n.honeypot==='dionaea'?'red':n.honeypot==='galah'?'purple':'blue';
      drawerEl.querySelector('#ev-drawer-sid').textContent = n.source_ip || '—';
      const rows = [];
      rows.push(`<div class="ev-d-hero"><div class="ev-d-ip">${esc(n.source_ip || '—')}</div><span class="badge ${hpColor}">${esc(n.honeypot || '?')}</span></div>`);
      if (n.username || n.password) rows.push(`<div class="ev-d-cred">👤 ${esc(n.username || '?')} &nbsp;/&nbsp; 🔑 ${esc(n.password || '?')}</div>`);
      if (n.command) rows.push(`<div class="ev-d-cmd">$ ${esc(n.command)}</div>`);
      if (n.http_path) rows.push(`<div class="ev-d-cmd">${esc(n.http_method||'GET')} ${esc(n.http_path)}</div>`);
      rows.push(`<div class="ev-d-section">Event</div>`);
      const evFields = [
        ['Timestamp', fmt.date(n.timestamp)],
        ['Action',    n.event_action || n.message || '—'],
        ['Honeypot',  n.honeypot],
        ['Source IP', n.source_ip],
        ['Protocol',  n.protocol],
        ['Dest Port', n.dest_port],
        ['Dest IP',   n.dest_ip],
        ['Session',   n.session_id],
        ['Severity',  n.severity],
      ];
      rows.push(evFields.filter(([,v]) => v != null && v !== '').map(([k,v]) =>
        `<div class="ev-d-row"><div class="ev-d-k">${esc(k)}</div><div class="ev-d-v">${esc(String(v))}</div></div>`
      ).join(''));
      const geo = (raw.source && typeof raw.source === 'object' && raw.source.geo) || raw.geo || {};
      if (geo.country_name || geo.city_name) {
        rows.push(`<div class="ev-d-section">Geolocation</div>`);
        [['Country', geo.country_name], ['City', geo.city_name], ['Region', geo.region_name],
         ['ASN', raw.source && typeof raw.source === 'object' && raw.source.as && raw.source.as.number]
        ].filter(([,v])=>v).forEach(([k,v])=>{
          rows.push(`<div class="ev-d-row"><div class="ev-d-k">${esc(k)}</div><div class="ev-d-v">${esc(String(v))}</div></div>`);
        });
      }
      if (hash) {
        rows.push(`<div class="ev-d-section">Integrity</div>`);
        rows.push(`<div class="ev-d-hash">SHA-256 · ${esc(hash)}</div>`);
      }
      rows.push(`<button class="ev-d-raw-toggle" data-raw-toggle>Show raw JSON ▾</button><pre class="ev-d-raw" data-raw-pre>${esc(JSON.stringify(raw, null, 2))}</pre>`);
      const body = drawerEl.querySelector('#ev-drawer-body');
      body.innerHTML = rows.join('');
      body.addEventListener('click', function handler(e) {
        const btn = e.target.closest('[data-raw-toggle]'); if (!btn) return;
        const pre = body.querySelector('[data-raw-pre]'); if (!pre) return;
        pre.classList.toggle('show');
        btn.textContent = pre.classList.contains('show') ? 'Hide JSON ▴' : 'Show raw JSON ▾';
      }, {once: false});
      drawerEl.classList.add('open');
      backdropEl.classList.add('show');
    } catch(err) {
      console.error('[evidence drawer]', err);
      const body = drawerEl && drawerEl.querySelector('#ev-drawer-body');
      if (body) body.innerHTML = `<div class="alert err" style="margin:12px">${esc(String(err))}</div>`;
      if (drawerEl) drawerEl.classList.add('open');
      if (backdropEl) backdropEl.classList.add('show');
    }
  }

  function closeDrawer() {
    activeIdx = null;
    document.querySelectorAll('.evlog').forEach(el => el.classList.remove('active'));
    drawerEl.classList.remove('open');
    backdropEl.classList.remove('show');
  }

  drawerEl.querySelector('#ev-drawer-close').addEventListener('click', closeDrawer);
  backdropEl.addEventListener('click', closeDrawer);
  const _keyHandler = e => { if (e.key === 'Escape') closeDrawer(); };
  document.addEventListener('keydown', _keyHandler);

  async function load() {
    closeDrawer();
    $('#ev-rows').innerHTML = `<div class="alert info">Loading…</div>`;
    try {
      const hp = $('#ev-hp').value;
      const limit = parseInt($('#ev-limit').value, 10) || 100;
      const params = { page_size: limit };
      let items = [];
      if (hp) {
        params.honeypot = hp;
        const res = await api.attacks(params);
        items = (res && res.items) || [];
      } else {
        const results = await Promise.allSettled([
          api.attacks({ ...params, honeypot: 'cowrie' }),
          api.attacks({ ...params, honeypot: 'dionaea' }),
          api.attacks({ ...params, honeypot: 'galah' }),
        ]);
        items = results.flatMap(r => r.status === 'fulfilled' ? ((r.value && r.value.items) || []) : []);
        items.sort((a, b) => +new Date(b.timestamp || (b.raw && b.raw['@timestamp']) || 0)
                            - +new Date(a.timestamp || (a.raw && a.raw['@timestamp']) || 0));
        items = items.slice(0, limit);
      }
      allItems = items;
      $('#ev-count').textContent = items.length;
      $('#ev-sealed').textContent = items.filter(it => it.sha256 || (it.raw && it.raw.sha256)).length;
      if (!items.length) { $('#ev-rows').innerHTML = `<div class="alert info">No logs matching these filters.</div>`; return; }
      $('#ev-rows').innerHTML = items.map((ev, i) => {
        const n = evNormalize(ev);
        const hash = ev.sha256 || (n.raw && n.raw.sha256) || '';
        const hpColor = n.honeypot==='cowrie'?'gold':n.honeypot==='dionaea'?'red':n.honeypot==='galah'?'purple':'blue';
        return `<div class="evlog" data-i="${i}">
          <div class="evlog-h">
            <div class="evlog-time">${fmt.time(n.timestamp)}</div>
            <div><span class="badge ${hpColor}">${esc(n.honeypot)}</span></div>
            <div class="evlog-msg">${esc(n.message || n.event_action || '—')}</div>
            <div class="evlog-hash">${hash ? '⬡ '+fmt.shortHash(hash) : '<span style="color:var(--text3)">—</span>'}</div>
          </div>
        </div>`;
      }).join('');
      document.querySelectorAll('.evlog').forEach((el, i) => { el.addEventListener('click', () => openDrawer(i)); });
    } catch (e) {
      $('#ev-rows').innerHTML = `<div class="alert err">${esc(e.message)}</div>`;
    }
  }

  $('#ev-hp').addEventListener('change', load);
  $('#ev-limit').addEventListener('change', load);
  $('#ev-refresh').addEventListener('click', load);

  window.__pageCleanup = () => {
    document.removeEventListener('keydown', _keyHandler);
    if (drawerEl && drawerEl.parentNode === document.body) drawerEl.remove();
    if (backdropEl && backdropEl.parentNode === document.body) backdropEl.remove();
  };

  await load();
})();

// ── Run Analysis Now button ───────────────────────────────────────────────────
(function () {
  const runBtn = document.getElementById('ev-run-btn');
  const runStatus = document.getElementById('ev-run-status');
  let pollInterval = null;

  function setRunning(isRunning) {
    runBtn.disabled = isRunning;
    runBtn.textContent = isRunning ? '⏳ Running...' : ' Run Analysis Now';
  }

  async function fetchStatus() {
    try { return await api._call('/api/forensics/status'); } catch (e) { return null; }
  }

  // Show last-run info on load
  fetchStatus().then(s => {
    if (!s || !s.timestamp) return;
    if (s.status === 'running') {
      setRunning(true);
      runStatus.textContent = '⏳ Analysis in progress...';
      startPolling();
    } else {
      const when = new Date(s.timestamp).toLocaleString();
      runStatus.textContent = `Last run: ${when} · ${s.status}`;
    }
  });

  function startPolling() {
    if (pollInterval) return;
    pollInterval = setInterval(async () => {
      const s = await fetchStatus();
      if (!s) return;
      if (s.status === 'completed') {
        clearInterval(pollInterval); pollInterval = null;
        setRunning(false);
        runStatus.textContent = '✅ Completed! Refreshing...';
        setTimeout(() => location.reload(), 2000);
      } else if (['error', 'failed', 'timeout'].includes(s.status)) {
        clearInterval(pollInterval); pollInterval = null;
        setRunning(false);
        runStatus.textContent = `❌ Failed: ${s.error || s.status}`;
      } else {
        runStatus.textContent = `Status: ${s.status}`;
      }
    }, 10000);
  }

  runBtn.addEventListener('click', async () => {
    setRunning(true);
    runStatus.textContent = 'Queuing analysis...';
    try {
      await api._call('/api/forensics/run', { method: 'POST' });
      runStatus.textContent = '✅ Queued — may take 2–5 min.';
      startPolling();
    } catch (e) {
      setRunning(false);
      runStatus.textContent = `Error: ${e.message}`;
    }
  });
}());
</script>
