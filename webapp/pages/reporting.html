<div class="page-head">
  <div>
    <div class="section-tag" style="margin-bottom:8px">Reporting</div>
    <h2 class="page-title">Rapports <span>forensiques</span></h2>
    <div class="page-sub">Sélectionne une session · prévisualise le rapport · télécharge le PDF certifié SHA-256.</div>
  </div>
  <div class="page-actions">
    <button class="btn btn-gh btn-sm" id="rep-refresh">Actualiser</button>
  </div>
</div>

<div class="grid-2 mb-20" style="grid-template-columns: 360px 1fr; gap:14px">

  <div class="card" style="padding:0">
    <div class="card-h" style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <div class="card-t">Sessions disponibles</div>
      <div class="card-sub"><span id="rep-count">—</span> session(s) · classées par risque</div>
    </div>
    <div id="rep-list" style="max-height:560px;overflow-y:auto">
      <div class="alert info" style="margin:14px">Chargement…</div>
    </div>
  </div>

  <div class="card" style="padding:0;display:flex;flex-direction:column;min-height:560px">
    <div class="card-h" style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div>
        <div class="card-t" id="rep-pv-title">Aperçu rapport</div>
        <div class="card-sub" id="rep-pv-sub">Sélectionne une session pour générer l'aperçu.</div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-gh btn-sm" id="rep-open" disabled title="Ouvrir dans un nouvel onglet">Ouvrir</button>
        <button class="btn btn-gold btn-sm" id="rep-download" disabled title="Télécharger PDF certifié">Télécharger PDF</button>
      </div>
    </div>
    <div id="rep-preview" style="flex:1;background:#fff;min-height:560px">
      <div class="alert info" style="margin:14px">Aucun rapport sélectionné.</div>
    </div>
    <div id="rep-status" style="padding:8px 16px;border-top:1px solid var(--border);font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text3);display:none"></div>
  </div>

</div>

<style>
.rep-row {
  display:grid; grid-template-columns: 1fr auto; gap:8px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background .15s;
}
.rep-row:hover { background: rgba(249,168,37,.05); }
.rep-row.active { background: rgba(249,168,37,.10); border-left: 3px solid var(--gold); padding-left: 13px; }
.rep-ip { font-family:'Share Tech Mono',monospace; font-size:12px; font-weight:700; color: var(--text); }
.rep-sid { font-family:'Share Tech Mono',monospace; font-size:10px; color: var(--text3); margin-top: 2px; }
.rep-meta { font-family:'Share Tech Mono',monospace; font-size:10px; color: var(--text3); margin-top: 4px; }
.rep-score { display:inline-block; padding: 3px 10px; border-radius: 4px; font-weight: 700; font-family:'Share Tech Mono',monospace; font-size: 12px; }
.rep-score.lo { background: rgba(21,101,192,.12); color: var(--blue2); }
.rep-score.md { background: rgba(249,168,37,.12); color: var(--gold); }
.rep-score.hi { background: rgba(198,40,40,.12); color: var(--red2); }
#rep-preview iframe { width:100%; height:100%; min-height:560px; border:none; background:#fff; }
</style>

<script>
(async function(){
  const { fmt, esc, $ } = FH;
  let sessions = [];
  let activeSid = null;

  function scoreCls(s) { if (s == null) return 'lo'; return s < 40 ? 'lo' : (s < 70 ? 'md' : 'hi'); }

  async function loadList() {
    $('#rep-list').innerHTML = '<div class="alert info" style="margin:14px">Chargement…</div>';
    let endpointMissing = false;
    try {
      try {
        sessions = await api.forensicSessions(50);
      } catch (e1) {
        if (e1.status === 404) { endpointMissing = true; sessions = []; }
        else throw e1;
      }
      /* Fallback: when the Sprint 4 forensic-sessions endpoint is not deployed,
         try /api/sessions (Sprint 3 forensic engine). Map shape to forensic-sessions. */
      if ((endpointMissing || !sessions.length)) {
        try {
          const ss = await api.sessions({ page_size: 50 });
          const items = (ss && ss.items) || [];
          if (items.length) {
            sessions = items.map(s => ({
              session_id: s.session_id || s.id,
              source_ip: s.source_ip,
              honeypot_type: s.honeypot_type || s.honeypot,
              risk_score: s.risk_score,
              kill_chain_phase: s.kill_chain_phase,
              primary_technique: s.primary_technique,
              started_at: s.started_at || s.first_event_at || s.created_at,
            }));
            endpointMissing = false;
          }
        } catch (_) { /* keep current sessions */ }
      }
      $('#rep-count').textContent = sessions.length;
      if (!sessions.length) {
        $('#rep-list').innerHTML = `<div class="alert info" style="margin:14px"><b>Aucune session forensique.</b><br>${
          endpointMissing
            ? 'Endpoint <span class="mono">/api/reports/forensic/sessions</span> non déployé (Sprint 4) et <span class="mono">/api/sessions</span> est vide.'
            : 'Lance le forensic-engine pour générer des sessions.'
        }</div>`;
        return;
      }
      $('#rep-list').innerHTML = sessions.map(s => `
        <div class="rep-row" data-sid="${esc(s.session_id)}">
          <div>
            <div class="rep-ip">${esc(s.source_ip || '—')}</div>
            <div class="rep-sid">${esc(s.session_id)}</div>
            <div class="rep-meta">${esc((s.honeypot_type||'').toUpperCase())} · ${esc(s.primary_technique || '—')} · ${esc(s.kill_chain_phase || '—')}</div>
          </div>
          <div style="text-align:right">
            <span class="rep-score ${scoreCls(s.risk_score)}">${s.risk_score == null ? '—' : s.risk_score}</span>
            <div class="rep-meta" style="margin-top:6px">${s.started_at ? fmt.date(s.started_at) : '—'}</div>
          </div>
        </div>`).join('');

      $('#rep-list').querySelectorAll('.rep-row').forEach(r => {
        r.addEventListener('click', () => selectSession(r.dataset.sid));
      });
    } catch (e) {
      $('#rep-list').innerHTML = `<div class="alert err" style="margin:14px">${esc(e.message)}</div>`;
    }
  }

  async function selectSession(sid) {
    if (!sid) return;
    activeSid = sid;
    $('#rep-list').querySelectorAll('.rep-row').forEach(r => r.classList.toggle('active', r.dataset.sid === sid));
    const s = sessions.find(x => x.session_id === sid) || {};

    $('#rep-pv-title').textContent = 'Aperçu · ' + sid;
    $('#rep-pv-sub').innerHTML = `<span class="mono">${esc(s.source_ip || '—')}</span> · risk <b>${s.risk_score == null ? '—' : s.risk_score}</b> · ${esc(s.kill_chain_phase || '—')}`;
    $('#rep-open').disabled = false;
    $('#rep-download').disabled = false;
    $('#rep-status').style.display = 'none';

    $('#rep-preview').innerHTML = '<div class="alert info" style="margin:14px">Génération de l\'aperçu…</div>';
    try {
      const tok = api.token();
      const res = await fetch(api.forensicReportPreviewUrl(sid), {
        headers: tok ? { 'Authorization': 'Bearer ' + tok } : {}
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      $('#rep-preview').innerHTML = `<iframe src="${url}" sandbox="allow-same-origin"></iframe>`;
    } catch (e) {
      $('#rep-preview').innerHTML = `<div class="alert err" style="margin:14px">Aperçu indisponible : ${esc(e.message)}</div>`;
    }
  }

  $('#rep-open').addEventListener('click', async () => {
    if (!activeSid) return;
    try {
      const tok = api.token();
      const res = await fetch(api.forensicReportPreviewUrl(activeSid), {
        headers: tok ? { 'Authorization': 'Bearer ' + tok } : {}
      });
      const html = await res.text();
      const w = window.open('', '_blank');
      w.document.open(); w.document.write(html); w.document.close();
    } catch (e) {
      alert('Erreur : ' + e.message);
    }
  });

  $('#rep-download').addEventListener('click', async () => {
    if (!activeSid) return;
    const btn = $('#rep-download'); const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Génération PDF…';
    $('#rep-status').style.display = 'block';
    $('#rep-status').innerHTML = '<span style="color:var(--gold)">Génération en cours…</span>';
    try {
      const r = await api.forensicReportDownload(activeSid);
      $('#rep-status').innerHTML = `<span style="color:var(--blue2)">PDF téléchargé</span> · SHA-256 : <span style="color:var(--gold);word-break:break-all">${esc(r.sha256 || 'N/A')}</span>`;
      btn.textContent = 'PDF téléchargé';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2500);
    } catch (e) {
      $('#rep-status').innerHTML = `<span style="color:var(--red2)">Erreur : ${esc(e.message)}</span>`;
      btn.textContent = orig; btn.disabled = false;
    }
  });

  $('#rep-refresh').addEventListener('click', loadList);
  await loadList();
})();
</script>
