services:
  galah:
    build: ./galah-src
    container_name: forenhive-galah
    restart: unless-stopped
    networks:
      - honeypot-net
      - backend-net
    ports:
      - "8080:8080"
      - "8888:8888"
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=mistral
      - LLM_SERVER_URL=http://forenhive-ollama:11434

networks:
  honeypot-net:
    external: true
  backend-net:
    name: backend-net
    driver: bridge
