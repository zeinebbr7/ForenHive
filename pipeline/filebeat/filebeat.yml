filebeat.inputs:

  - type: log
    enabled: true
    paths:
      - /var/log/cowrie/log/cowrie/cowrie.json
    tags: ["cowrie", "honeypot"]
    json.keys_under_root: true
    json.add_error_key: true

  - type: log
    enabled: true
    paths:
      - /var/log/dionaea/dionaea/dionaea.log
    tags: ["dionaea", "honeypot"]

  - type: log
    enabled: true
    paths:
      - /var/log/zeek/2*/conn.log
      - /var/log/zeek/2*/ssh.log
    tags: ["zeek", "honeypot"]
    json.keys_under_root: true
    json.add_error_key: true

  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/
    stream: stdout
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - drop_event:
          when:
            not:
              equals:
                container.name: "forenhive-galah"
    tags: ["galah", "honeypot"]


  - type: log
    enabled: true
    paths:
      - /var/log/galah/event_log.json
    tags: ["galah", "honeypot"]
    json.keys_under_root: true
    json.add_error_key: true

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
